    );

    document.getElementById("closeStaffEditor").onclick = function(){ closeModal(); renderAll(); };

    document.getElementById("addStaffBtn").addEventListener("click", async function(){
      var name = await showNestedPrompt("추가할 이름을 입력해주세요.");
      if(!name) return;
      name = name.trim();
      if(!name) return;
      if(S.staff.indexOf(name) !== -1){ showToast("이미 있는 이름입니다."); return; }
      S.staff.push(name);
      await storageSet(K_STAFF, S.staff, true);
      renderStaffEditorModal();
      showToast("추가되었습니다.");
    });

    document.querySelectorAll('[data-role="staffname"]').forEach(function(el){
      el.addEventListener("change", async function(){
        var idx = parseInt(el.getAttribute("data-idx"),10);
        var oldName = S.staff[idx];
        var newName = el.value.trim();
        if(!newName){ el.value = oldName; return; }
        if(newName === oldName) return;
        if(S.staff.indexOf(newName) !== -1){
          showToast("이미 있는 이름입니다.");
          el.value = oldName;
          return;
        }
        S.staff[idx] = newName;
        S.patients.forEach(function(p){ if(p.nurse === oldName) p.nurse = newName; });
        await storageSet(K_STAFF, S.staff, true);
        await storageSet(K_PATIENTS, S.patients, true);
        if(S.who === oldName){
          S.who = newName;
          await storageSet(K_LAST_NAME, S.who, false);
          renderWhoSelect();
        }
        showToast("변경되었습니다.");
      });
    });

    document.querySelectorAll('[data-role="delstaff"]').forEach(function(el){
      el.addEventListener("click", async function(){
        var idx = parseInt(el.getAttribute("data-idx"),10);
        var name = S.staff[idx];
        var count = S.patients.filter(function(p){ return p.nurse === name; }).length;
        var msg = count > 0
          ? (name + " 님에게 배정된 환자 " + count + "명이 \"미배정\" 상태로 바뀝니다. 삭제할까요?")
          : (name + " 님을 명단에서 삭제할까요?");
        var ok = await showConfirm(msg);
        if(!ok) return;
        S.staff.splice(idx, 1);
        S.patients.forEach(function(p){ if(p.nurse === name) p.nurse = ""; });
        await storageSet(K_STAFF, S.staff, true);
        await storageSet(K_PATIENTS, S.patients, true);
        if(S.who === name){
          S.who = "전체";
          await storageSet(K_LAST_NAME, S.who, false);
          renderWhoSelect();
        }
        renderStaffEditorModal();
        showToast("삭제되었습니다.");
      });
    });
  }

  var editorCat = CATS[0];
  function openTemplateEditor(){
    editorCat = CATS[0];
    renderTemplateEditorModal();
  }

  function renderTemplateEditorModal(){
    var tabs = CATS.map(function(c){
      return '<div class="cat-tab '+(c===editorCat?'active':'')+'" data-cat="'+c+'">'+c+'</div>';
    }).join("");

    var groups = S.templates[editorCat] || [];
    var groupsHtml = groups.map(function(g, gi){
      var itemsHtml = g.items.map(function(it, ii){
        var req = it.req || {first:false, after:false};
        return '<div class="admin-item-row">' +
          '<input type="text" value="'+escapeHtml(it.name)+'" data-gi="'+gi+'" data-ii="'+ii+'" data-role="itemname">' +
          '<select data-gi="'+gi+'" data-ii="'+ii+'" data-role="itemtype">' +
            '<option value="check" '+(it.type==="check"?"selected":"")+'>체크형</option>' +
            '<option value="log" '+(it.type==="log"?"selected":"")+'>날짜기록형</option>' +
          '</select>' +
          '<label style="display:flex;align-items:center;gap:3px;font-size:11px;color:var(--ink-soft);white-space:nowrap;">' +
            '<input type="checkbox" data-gi="'+gi+'" data-ii="'+ii+'" data-role="reqfirst" '+(req.first?"checked":"")+'>첫달필수</label>' +
          '<label style="display:flex;align-items:center;gap:3px;font-size:11px;color:var(--ink-soft);white-space:nowrap;">' +
            '<input type="checkbox" data-gi="'+gi+'" data-ii="'+ii+'" data-role="reqafter" '+(req.after?"checked":"")+'>이후필수</label>' +
          '<label style="display:flex;align-items:center;gap:3px;font-size:11px;color:var(--ink-soft);white-space:nowrap;">' +
            '<input type="checkbox" data-gi="'+gi+'" data-ii="'+ii+'" data-role="reqonce" '+(it.once?"checked":"")+'>1회성(사전가능)</label>' +
          '<button class="icon-btn" data-gi="'+gi+'" data-ii="'+ii+'" data-role="delitem">✕</button>' +
        '</div>';
      }).join("");
      return '<div class="admin-group" data-gi="'+gi+'">' +
        '<div class="admin-group-head">' +
          '<input type="text" value="'+escapeHtml(g.group)+'" data-gi="'+gi+'" data-role="groupname">' +
          '<button class="icon-btn" data-gi="'+gi+'" data-role="delgroup">✕</button>' +
        '</div>' +
        itemsHtml +
        '<button class="add-line" data-gi="'+gi+'" data-role="additem">+ 항목 추가</button>' +
      '</div>';
    }).join("");

    openModal(
      '<h3>항목 구성 관리</h3>' +
      '<p style="font-size:12.5px;color:var(--ink-soft);margin-top:-10px;">여기서 바꾼 항목 구성은 모든 환자·모든 직원 화면에 즉시 반영됩니다.</p>' +
      '<div class="cat-tabs">'+tabs+'</div>' +
      '<div id="groupsWrap">'+groupsHtml+'</div>' +
      '<button class="add-line" id="addGroupBtn" style="width:100%;text-align:center;margin-top:4px;">+ 중분류 추가</button>' +
      '<div class="modal-actions"><button class="btn btn-teal" id="closeEditor" style="width:100%;">닫기</button></div>'
    );

    document.querySelectorAll(".cat-tab").forEach(function(el){
      el.addEventListener("click", function(){
        editorCat = el.getAttribute("data-cat");
        renderTemplateEditorModal();
      });
    });
    document.getElementById("closeEditor").onclick = function(){ closeModal(); renderAll(); };

    document.getElementById("addGroupBtn").addEventListener("click", async function(){
      S.templates[editorCat].push({ group:"새 중분류", items:[] });
      await storageSet(K_TEMPLATES, S.templates, true);
      renderTemplateEditorModal();
    });

    document.querySelectorAll('[data-role="delgroup"]').forEach(function(el){
      el.addEventListener("click", async function(){
        var gi = parseInt(el.getAttribute("data-gi"),10);
        var ok = await showConfirm("이 중분류와 하위 항목을 모두 삭제할까요?");
        if(ok){
          S.templates[editorCat].splice(gi,1);
          await storageSet(K_TEMPLATES, S.templates, true);
          renderTemplateEditorModal();
        }
      });
    });
    document.querySelectorAll('[data-role="groupname"]').forEach(function(el){
      el.addEventListener("change", async function(){
        var gi = parseInt(el.getAttribute("data-gi"),10);
        S.templates[editorCat][gi].group = el.value.trim() || "이름없음";
        await storageSet(K_TEMPLATES, S.templates, true);
      });
    });
    document.querySelectorAll('[data-role="additem"]').forEach(function(el){
      el.addEventListener("click", async function(){
        var gi = parseInt(el.getAttribute("data-gi"),10);
        S.templates[editorCat][gi].items.push({ name:"새 항목", type:"check", req:{first:false, after:false} });
        await storageSet(K_TEMPLATES, S.templates, true);
        renderTemplateEditorModal();
      });
    });
    document.querySelectorAll('[data-role="reqfirst"]').forEach(function(el){
      el.addEventListener("change", async function(){
        var gi = parseInt(el.getAttribute("data-gi"),10), ii = parseInt(el.getAttribute("data-ii"),10);
        var it = S.templates[editorCat][gi].items[ii];
        if(!it.req) it.req = {first:false, after:false};
        it.req.first = el.checked;
        await storageSet(K_TEMPLATES, S.templates, true);
      });
    });
    document.querySelectorAll('[data-role="reqafter"]').forEach(function(el){
      el.addEventListener("change", async function(){
        var gi = parseInt(el.getAttribute("data-gi"),10), ii = parseInt(el.getAttribute("data-ii"),10);
        var it = S.templates[editorCat][gi].items[ii];
        if(!it.req) it.req = {first:false, after:false};
        it.req.after = el.checked;
        await storageSet(K_TEMPLATES, S.templates, true);
      });
    });
    document.querySelectorAll('[data-role="reqonce"]').forEach(function(el){
      el.addEventListener("change", async function(){
        var gi = parseInt(el.getAttribute("data-gi"),10), ii = parseInt(el.getAttribute("data-ii"),10);
        S.templates[editorCat][gi].items[ii].once = el.checked;
        await storageSet(K_TEMPLATES, S.templates, true);
      });
    });
    document.querySelectorAll('[data-role="delitem"]').forEach(function(el){
      el.addEventListener("click", async function(){
        var gi = parseInt(el.getAttribute("data-gi"),10), ii = parseInt(el.getAttribute("data-ii"),10);
        S.templates[editorCat][gi].items.splice(ii,1);
        await storageSet(K_TEMPLATES, S.templates, true);
        renderTemplateEditorModal();
      });
    });
    document.querySelectorAll('[data-role="itemname"]').forEach(function(el){
      el.addEventListener("change", async function(){
        var gi = parseInt(el.getAttribute("data-gi"),10), ii = parseInt(el.getAttribute("data-ii"),10);
        S.templates[editorCat][gi].items[ii].name = el.value.trim() || "이름없음";
        await storageSet(K_TEMPLATES, S.templates, true);
      });
    });
    document.querySelectorAll('[data-role="itemtype"]').forEach(function(el){
      el.addEventListener("change", async function(){
        var gi = parseInt(el.getAttribute("data-gi"),10), ii = parseInt(el.getAttribute("data-ii"),10);
        S.templates[editorCat][gi].items[ii].type = el.value;
        await storageSet(K_TEMPLATES, S.templates, true);
      });
    });
  }

  /* ================= 로그인 ================= */
  function showLoginError(msg){
    var el = document.getElementById("loginError");
    el.textContent = msg;
    el.classList.add("show");
  }
  function clearLoginError(){
    var el = document.getElementById("loginError");
    el.textContent = "";
    el.classList.remove("show");
  }
  function startApp(){
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("appRoot").style.display = "";
    var badge = document.getElementById("userBadge");
    if(badge && SESSION) badge.innerHTML = "<b>" + escapeHtml(SESSION.name) + "</b> · " + escapeHtml(SESSION.role);
    init();
  }

  async function loadLoginUsers(){
    var select = document.getElementById("loginName");
    try{
      var r = await apiCall("list_users", {});
      if(r && r.ok && r.users && r.users.length){
        select.innerHTML = r.users.map(function(u){
          return '<option value="'+escapeHtml(u.name)+'">'+escapeHtml(u.name)+' ('+escapeHtml(u.role)+')</option>';
        }).join("");
      } else {
        select.innerHTML = '<option value="">사용자 목록을 불러올 수 없습니다</option>';
        document.getElementById("loginConfigNote").textContent =
          "구글시트 연동 주소(SHEETS_API_URL)가 아직 설정되지 않았거나 접속할 수 없습니다. 관리자에게 문의해주세요.";
      }
    }catch(e){
      select.innerHTML = '<option value="">사용자 목록을 불러올 수 없습니다</option>';
      document.getElementById("loginConfigNote").textContent =
        "인터넷 연결을 확인해주세요. (구글시트 연동 주소 미설정일 수 있습니다)";
    }
  }

  function initLoginScreen(){
    loadLoginUsers();
    var submitBtn = document.getElementById("loginSubmit");
    var pinInput = document.getElementById("loginPin");
    async function attemptLogin(){
      clearLoginError();
      var name = document.getElementById("loginName").value;
      var pin = pinInput.value.trim();
      if(!name){ showLoginError("이름을 선택해주세요."); return; }
      if(!pin){ showLoginError("PIN을 입력해주세요."); return; }
      submitBtn.disabled = true;
      submitBtn.textContent = "확인 중...";
      try{
        var r = await apiCall("login", { name: name, pin: pin });
        if(r && r.ok){
          var remember = document.getElementById("rememberMe").checked;
          saveSession({ token: r.token, name: r.name, role: r.role }, remember);
          startApp();
        } else {
          showLoginError((r && r.message) || "로그인에 실패했습니다.");
        }
      }catch(e){
        showLoginError("서버에 연결할 수 없습니다. 인터넷 연결을 확인해주세요.");
      }
      submitBtn.disabled = false;
      submitBtn.textContent = "로그인";
    }
    submitBtn.addEventListener("click", attemptLogin);
    pinInput.addEventListener("keydown", function(ev){ if(ev.key === "Enter") attemptLogin(); });
  }

  function initLogoutButton(){
    var btn = document.getElementById("logoutBtn");
    if(btn) btn.addEventListener("click", function(){
      saveSession(null);
      location.reload();
    });
  }

  async function bootstrap(){
    var existing = loadSession();
    if(existing && existing.token){
      SESSION = existing;
      // 저장된 토큰이 아직 유효한지 가볍게 확인
      try{
        var check = await apiCall("kv_get", { key: K_TEMPLATES });
        if(check && check.ok){
          initLogoutButton();
          startApp();
          return;
        }
      }catch(e){ /* 아래로 진행해 로그인 화면 표시 */ }
      saveSession(null);
    }
    initLogoutButton();
    initLoginScreen();
  }

  bootstrap();
})();
</script>
</body>
</html>
