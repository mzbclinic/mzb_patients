  function openVisitModal(presetCandidate, editVisitId){
    var editing = null, editingYear = S.visitLogYear, editingMonth = S.visitLogMonth;
    if(editVisitId){
      editing = S.visits.find(function(v){ return v.id === editVisitId; });
    }

    var candOptions = '<option value="">-- 대상자 선택 --</option>' + S.candidates.slice().sort(function(a,b){
      return (a.name||"").localeCompare(b.name||"","ko");
    }).map(function(c){
      return '<option value="'+escapeHtml(c.no||"")+'|'+escapeHtml(c.name)+'">'+escapeHtml(c.no||"-")+' · '+escapeHtml(c.name)+'</option>';
    }).join("");

    var nurseOptions = '<option value="">선택 안 함</option>' + S.staff.map(function(n){
      return '<option value="'+escapeHtml(n)+'" '+(editing && editing.nurse===n ? "selected" : "")+'>'+escapeHtml(n)+'</option>';
    }).join("") + '<option value="__add__">+ 새 이름 추가</option>';

    var defaultNo = editing ? editing.no : (presetCandidate ? presetCandidate.no : "");
    var defaultName = editing ? editing.name : (presetCandidate ? presetCandidate.name : "");
    var defaultDate = editing ? editing.date : todayStr();

    var visitTypeOptions = '<option value="">-- 선택 --</option>' + VISIT_TYPES.map(function(t){
      return '<option value="'+t+'" '+(editing && editing.visitType===t ? "selected" : "")+'>'+t+'</option>';
    }).join("");

    openModal(
      '<h3>'+(editing?'방문 기록 수정':'새 방문 등록')+'</h3>' +
      '<div class="field"><label>대상자 선택 (목록에 없으면 아래 번호·이름 직접 입력)</label><select id="vCandSelect">'+candOptions+'</select></div>' +
      '<div class="field"><label>등록번호</label><input type="text" id="vNo" value="'+escapeHtml(defaultNo||"")+'" placeholder="예: 78"></div>' +
      '<div class="field"><label>이름</label><input type="text" id="vName" value="'+escapeHtml(defaultName||"")+'" placeholder="예: 최옥희"></div>' +
      '<div class="field"><label>방문일자</label><input type="date" id="vDate" value="'+defaultDate+'"></div>' +
      '<div class="field"><label>방문유형</label><select id="vType">'+visitTypeOptions+'</select></div>' +
      '<div class="field"><label>방문간호사 (그날 실제로 방문한 사람)</label><select id="vNurse">'+nurseOptions+'</select></div>' +
      '<div class="field"><label>간호 메모</label><textarea id="vMemo" rows="2" style="width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;font-size:14px;background:var(--paper);color:var(--ink);">'+(editing?escapeHtml(editing.memo||""):"")+'</textarea></div>' +
      '<div class="field"><label>비고</label><input type="text" id="vNote" value="'+(editing?escapeHtml(editing.note||""):"")+'" placeholder="특이사항, 다음 일정 등"></div>' +
      '<div class="modal-actions">' +
        '<button class="btn" id="vCancel">취소</button>' +
        (editing ? '<button class="btn" style="color:var(--warn);border-color:var(--warn);" id="vDelete">삭제</button>' : '') +
        '<button class="btn btn-teal" id="vSave">'+(editing?'저장':'등록')+'</button>' +
      '</div>'
    );

    document.getElementById("vCandSelect").addEventListener("change", function(e){
      var v = e.target.value;
      if(!v) return;
      var parts = v.split("|");
      document.getElementById("vNo").value = parts[0];
      document.getElementById("vName").value = parts[1];
    });

    document.getElementById("vNurse").addEventListener("change", async function(e){
      if(e.target.value === "__add__"){
        var name = await showNestedPrompt("방문간호사 이름을 입력해주세요.");
        var sel = document.getElementById("vNurse");
        if(name){
          name = name.trim();
          if(name && S.staff.indexOf(name) === -1){ S.staff.push(name); await storageSet(K_STAFF, S.staff, true); }
          var opt = document.createElement("option");
          opt.value = name; opt.textContent = name;
          sel.insertBefore(opt, sel.querySelector('option[value="__add__"]'));
          sel.value = name;
        } else {
          sel.value = editing && editing.nurse ? editing.nurse : "";
        }
      }
    });

    document.getElementById("vCancel").onclick = closeModal;

    if(editing){
      document.getElementById("vDelete").onclick = async function(){
        var ok = await showConfirm("이 방문 기록을 삭제할까요?");
        if(!ok) return;
        S.visits = S.visits.filter(function(v){ return v.id !== editing.id; });
        await saveVisitsForMonth(editingYear, editingMonth, S.visits);
        S.visitsCache[monthKey(editingYear, editingMonth)] = S.visits;
        var delSyncTarget = getSyncTargetForVisitType(editing.visitType);
        if(delSyncTarget){
          await removeSyncedChecklistDate(editing.no, delSyncTarget.cat, delSyncTarget.group, editing.date);
        }
        closeModal();
        showToast("삭제되었습니다.");
        renderAll();
      };
    }

    document.getElementById("vSave").onclick = async function(){
      var no = document.getElementById("vNo").value.trim();
      var name = document.getElementById("vName").value.trim();
      var date = document.getElementById("vDate").value;
      var visitType = document.getElementById("vType").value.trim();
      var nurse = document.getElementById("vNurse").value;
      var memo = document.getElementById("vMemo").value.trim();
      var note = document.getElementById("vNote").value.trim();

      if(!name){ showToast("이름을 입력해주세요."); return; }
      if(!date){ showToast("방문일자를 선택해주세요."); return; }
      if(nurse === "__add__") nurse = "";

      var d = new Date(date + "T00:00:00");
      var targetYear = d.getFullYear(), targetMonth = d.getMonth() + 1;
      var visitNo = makeVisitNo(no, date);

      var oldNo = editing ? editing.no : null;
      var oldDate = editing ? editing.date : null;
      var oldVisitType = editing ? editing.visitType : null;

      var record = editing || { id: uid("v"), createdAt: todayStr(), bloodTest:false, mintVisit:false };
      record.no = no; record.name = name; record.date = date; record.visitNo = visitNo;
      record.visitType = visitType; record.nurse = nurse; record.memo = memo; record.note = note;

      if(editing){
        if(targetYear !== editingYear || targetMonth !== editingMonth){
          // 날짜를 다른 달로 바꾼 경우: 기존 달 목록에서 빼고 새 달 목록으로 이동
          var remaining = S.visits.filter(function(v){ return v.id !== editing.id; });
          await saveVisitsForMonth(editingYear, editingMonth, remaining);
          S.visitsCache[monthKey(editingYear, editingMonth)] = remaining;
          if(editingYear === S.visitLogYear && editingMonth === S.visitLogMonth){ S.visits = remaining; }
          var otherList = (targetYear === S.visitLogYear && targetMonth === S.visitLogMonth) ? S.visits : await loadVisitsForMonth(targetYear, targetMonth);
          otherList.push(record);
          await saveVisitsForMonth(targetYear, targetMonth, otherList);
          S.visitsCache[monthKey(targetYear, targetMonth)] = otherList;
          if(targetYear === S.visitLogYear && targetMonth === S.visitLogMonth){ S.visits = otherList; }
        } else {
          await saveVisitsForMonth(editingYear, editingMonth, S.visits);
          S.visitsCache[monthKey(editingYear, editingMonth)] = S.visits;
        }
      } else {
        var sameAsCurrent = (targetYear === S.visitLogYear && targetMonth === S.visitLogMonth);
        var list = sameAsCurrent ? S.visits : await loadVisitsForMonth(targetYear, targetMonth);
        list.push(record);
        await saveVisitsForMonth(targetYear, targetMonth, list);
        S.visitsCache[monthKey(targetYear, targetMonth)] = list;
        if(sameAsCurrent){ S.visits = list; }
      }

      closeModal();
      showToast(editing ? "수정되었습니다." : "방문목록에 등록되었습니다.");

      if(record.bloodTest){
        await ensureBloodTestForVisit(record);
      }

      // 일방시/추가간호 방문은 체크리스트의 "방문 날짜" 로그에도 자동으로 반영합니다.
      var oldSyncTarget = editing ? getSyncTargetForVisitType(oldVisitType) : null;
      var newSyncTarget = getSyncTargetForVisitType(visitType);
      if(oldSyncTarget && (!newSyncTarget || oldNo !== no || oldDate !== date || oldSyncTarget.cat !== newSyncTarget.cat || oldSyncTarget.group !== newSyncTarget.group)){
        await removeSyncedChecklistDate(oldNo, oldSyncTarget.cat, oldSyncTarget.group, oldDate);
      }
      if(newSyncTarget){
        await addSyncedChecklistDate(no, newSyncTarget.cat, newSyncTarget.group, date);
      }

      // 등록/이동된 방문이 지금 보고 있는 달과 다르면, 그 달 방문목록 화면으로 전환해서 바로 보여줌
      if(targetYear !== S.visitLogYear || targetMonth !== S.visitLogMonth){
        setAppView("visits");
        await switchVisitMonth(targetYear, targetMonth);
      } else {
        setAppView("visits");
      }
    };
  }

  /* ================= 혈액검사 화면 ================= */
  var BLOODTEST_TYPES = ["방문", "내원"];
  var BLOODTEST_STATUS = ["대기중", "결과통보"];

  function makeBloodTestIdentifier(name, dateStr){
    var d = new Date(dateStr + "T00:00:00");
    var yy = String(d.getFullYear()).slice(2);
    var mm = pad2(d.getMonth()+1), dd = pad2(d.getDate());
    return name + "(" + yy + "-" + mm + "-" + dd + ")";
  }

  // 방문목록에서 혈액검사가 체크된 방문에 대해, 아직 혈액검사 목록에 없으면 자동으로 만들어줍니다.
  async function ensureBloodTestForVisit(visit){
    var exists = S.bloodTests.find(function(b){ return b.linkedVisitId === visit.id; });
    if(exists) return;
    S.bloodTests.push({
      id: uid("b"),
      prescribedDate: visit.date,
      no: visit.no,
      name: visit.name,
      type: "방문",
      resultStatus: "대기중",
      note: "",
      linkedVisitId: visit.id,
      identifier: makeBloodTestIdentifier(visit.name, visit.date),
      createdAt: todayStr()
    });
    await storageSet(K_BLOODTESTS, S.bloodTests, true);
  }

  function renderBloodTestView(){
    var el = document.getElementById("bloodTestView");
    if(!el) return;

    var tf = S.tableFilters.bloodtest;
    var list = S.bloodTests.slice()
      .filter(function(b){
        if(!rowTextMatches(b.no, tf.no)) return false;
        if(!rowTextMatches(b.name, tf.name)) return false;
        if(!rowSelectMatches(b.type, tf.type)) return false;
        if(!rowSelectMatches(b.resultStatus, tf.resultStatus)) return false;
        return true;
      })
      .sort(function(a,b){
        return (a.prescribedDate||"").localeCompare(b.prescribedDate||"");
      });
    var waitingCount = S.bloodTests.filter(function(b){ return b.resultStatus === "대기중"; }).length;

    var html = '<div class="toolbar"><h2>혈액검사 <span style="font-weight:400;color:var(--ink-soft);font-size:12.5px;">(전체 '+S.bloodTests.length+'건 · 대기중 '+waitingCount+'건)</span></h2>' +
      '<button class="btn btn-teal" id="addBloodTestBtn">+ 새 검사 등록</button></div>';

    html += '<div class="assign-table-wrap"><table class="assign-table"><thead><tr>' +
      '<th>처방일자</th><th>식별자</th><th>등록번호</th><th>이름</th><th>유형</th><th>결과통보</th><th>비고</th><th></th>' +
    '</tr>' +
    buildFilterHeaderRow("bloodtest", [
      { key:"prescribedDate", type:"none" },
      { key:"identifier", type:"none" },
      { key:"no", type:"text" },
      { key:"name", type:"text" },
      { key:"type", type:"select", options: BLOODTEST_TYPES.map(function(t){ return {value:t,label:t}; }) },
      { key:"resultStatus", type:"select", options: BLOODTEST_STATUS.map(function(s){ return {value:s,label:s}; }) },
      { key:"note", type:"none" },
      { key:"_actions", type:"none" }
    ]) +
    '</thead><tbody>';

    if(list.length === 0){
      html += '<tr><td colspan="8" style="text-align:center;color:var(--ink-soft);padding:24px;">등록된 혈액검사가 없습니다.</td></tr>';
    } else {
      list.forEach(function(b){
        var checked = b.resultStatus === "결과통보";
        var statusTag = '<label style="display:flex;align-items:center;gap:5px;cursor:pointer;">' +
          '<input type="checkbox" class="chk" data-act="togglestatus" data-bid="'+b.id+'" '+(checked?'checked':'')+'>' +
          '<span style="font-size:12px;color:'+(checked?'var(--teal)':'var(--ink-soft)')+';">'+(checked?'결과통보':'대기중')+'</span>' +
        '</label>';
        html += '<tr>' +
          '<td>'+escapeHtml(b.prescribedDate||"")+'</td>' +
          '<td style="font-variant-numeric:tabular-nums;">'+escapeHtml(b.identifier||"")+'</td>' +
          '<td>'+escapeHtml(b.no||"")+'</td>' +
          '<td style="font-weight:600;">'+escapeHtml(b.name||"")+'</td>' +
          '<td>'+escapeHtml(b.type||"")+'</td>' +
          '<td>'+statusTag+'</td>' +
          '<td class="memo-cell"><input type="text" class="inline-edit" data-act="editbloodnote" data-bid="'+b.id+'" value="'+escapeHtml(b.note||"")+'"></td>' +
          '<td><button class="btn btn-sm" data-act="editblood" data-bid="'+b.id+'">수정</button></td>' +
        '</tr>';
      });
    }
    html += '</tbody></table></div>';

    el.innerHTML = html;

    document.getElementById("addBloodTestBtn").addEventListener("click", function(){ openBloodTestModal(); });
    el.querySelectorAll('[data-act="editblood"]').forEach(function(btn){
      btn.addEventListener("click", function(){ openBloodTestModal(btn.getAttribute("data-bid")); });
    });
    el.querySelectorAll('[data-act="togglestatus"]').forEach(function(chk){
      chk.addEventListener("click", function(ev){ ev.stopPropagation(); });
      chk.addEventListener("change", async function(e){
        var b = S.bloodTests.find(function(x){ return x.id === e.target.getAttribute("data-bid"); });
        if(!b) return;
        b.resultStatus = e.target.checked ? "결과통보" : "대기중";
        await storageSet(K_BLOODTESTS, S.bloodTests, true);
        renderBloodTestView();
      });
    });
    el.querySelectorAll('[data-act="editbloodnote"]').forEach(function(inp){
      inp.addEventListener("click", function(ev){ ev.stopPropagation(); });
      inp.addEventListener("change", async function(e){
        var b = S.bloodTests.find(function(x){ return x.id === e.target.getAttribute("data-bid"); });
        if(!b) return;
        b.note = e.target.value.trim();
        await storageSet(K_BLOODTESTS, S.bloodTests, true);
      });
    });
    bindFilterHeaderRow(el, "bloodtest", renderBloodTestView);
  }

  function openBloodTestModal(editId){
    var editing = editId ? S.bloodTests.find(function(x){ return x.id === editId; }) : null;

    var typeOptions = BLOODTEST_TYPES.map(function(t){
      return '<option value="'+t+'" '+(editing && editing.type===t ? "selected" : "")+'>'+t+'</option>';
    }).join("");
    var statusOptions = BLOODTEST_STATUS.map(function(s){
      return '<option value="'+s+'" '+(editing && editing.resultStatus===s ? "selected" : (!editing && s==="대기중" ? "selected":""))+'>'+s+'</option>';
    }).join("");

    var defaultDate = editing ? editing.prescribedDate : todayStr();

    openModal(
      '<h3>'+(editing?'혈액검사 정보 수정':'새 검사 등록')+'</h3>' +
      (editing && editing.linkedVisitId ? '<p style="font-size:11.5px;color:var(--ink-soft);margin-top:-8px;">방문목록에서 자동 연동된 항목입니다.</p>' : '') +
      '<div class="field"><label>등록번호</label><input type="text" id="bNo" value="'+(editing?escapeHtml(editing.no||""):"")+'" placeholder="예: 78"></div>' +
      '<div class="field"><label>이름</label><input type="text" id="bName" value="'+(editing?escapeHtml(editing.name||""):"")+'" placeholder="예: 최옥희"></div>' +
      '<div class="field"><label>처방일자</label><input type="date" id="bDate" value="'+defaultDate+'"></div>' +
      '<div class="field"><label>유형</label><select id="bType">'+typeOptions+'</select></div>' +
      '<div class="field"><label>결과통보</label><select id="bStatus">'+statusOptions+'</select></div>' +
      '<div class="field"><label>비고</label><input type="text" id="bNote" value="'+(editing?escapeHtml(editing.note||""):"")+'" placeholder="특이사항"></div>' +
      '<div class="modal-actions">' +
        '<button class="btn" id="bCancel">취소</button>' +
        (editing ? '<button class="btn" style="color:var(--warn);border-color:var(--warn);" id="bDelete">삭제</button>' : '') +
        '<button class="btn btn-teal" id="bSave">'+(editing?'저장':'등록')+'</button>' +
      '</div>'
    );

    document.getElementById("bCancel").onclick = closeModal;
    if(editing){
      document.getElementById("bDelete").onclick = async function(){
        var ok = await showConfirm("이 혈액검사 기록을 삭제할까요?");
        if(!ok) return;
        S.bloodTests = S.bloodTests.filter(function(x){ return x.id !== editing.id; });
        await storageSet(K_BLOODTESTS, S.bloodTests, true);
        closeModal();
        showToast("삭제되었습니다.");
        renderAll();
      };
    }

    document.getElementById("bSave").onclick = async function(){
      var no = document.getElementById("bNo").value.trim();
      var name = document.getElementById("bName").value.trim();
      var date = document.getElementById("bDate").value;
      var type = document.getElementById("bType").value;
      var resultStatus = document.getElementById("bStatus").value;
      var note = document.getElementById("bNote").value.trim();

      if(!name){ showToast("이름을 입력해주세요."); return; }
      if(!date){ showToast("처방일자를 선택해주세요."); return; }

      var identifier = makeBloodTestIdentifier(name, date);

      if(editing){
        editing.no = no; editing.name = name; editing.prescribedDate = date; editing.type = type;
        editing.resultStatus = resultStatus; editing.note = note;
        editing.identifier = identifier;
      } else {
        S.bloodTests.push({
          id: uid("b"), no:no, name:name, prescribedDate:date, type:type,
          resultStatus:resultStatus, note:note,
          identifier:identifier, createdAt: todayStr()
        });
      }
      await storageSet(K_BLOODTESTS, S.bloodTests, true);
      closeModal();
      showToast(editing ? "수정되었습니다." : "등록되었습니다.");
      renderAll();
    };
  }

  /* ================= 항목 트리 순회 유틸 ================= */
  function forEachItem(patient, cb){
    // cb(category, group, item, itemKey)
    (patient.categories || []).forEach(function(cat){
      var groups = S.templates[cat] || [];
      groups.forEach(function(g){
        (g.items || []).forEach(function(it){
          var key = cat + "|" + g.group + "|" + it.name;
          cb(cat, g, it, key);
        });
      });
    });
  }

  /* ---- 간호사 필터 / 등록월 노출 / 정렬 ---- */
  // 현재 선택된 간호사(S.who) 기준으로 환자를 걸러줍니다. "전체"면 전부 반환.
  function getNurseFilteredPatients(){
    if(S.who === "전체") return S.patients;
    return S.patients.filter(function(p){ return p.nurse === S.who; });
  }

  // 환자가 리스트에 "노출되기 시작하는" 월. 구분마다 등록월이 다르면 가장 이른 달을 기준으로 함.
  // 등록월이 아예 없는 구분은 UNSET_VISIBLE_FROM(오늘 기준 현재월)을 임시 기준으로 사용.
  function getPatientVisibleFromMonth(p){
    if(p.registeredDate){ return p.registeredDate.slice(0,7); }
    var cats = p.categories || [];
    if(cats.length === 0) return UNSET_VISIBLE_FROM;
    var min = null;
    cats.forEach(function(cat){
      var sm = (p.startMonths && p.startMonths[cat]) ? p.startMonths[cat] : UNSET_VISIBLE_FROM;
      if(min === null || sm < min) min = sm;
    });
    return min;
  }

  // 현재 화면(월별/연간)에서 이 환자가 보여야 하는지
  function isPatientVisibleForCurrentView(p){
    var visibleFrom = getPatientVisibleFromMonth(p);
    if(S.viewMode === "year"){
      return visibleFrom.slice(0,4) <= String(S.year);
    }
    return monthKey(S.year, S.month) >= visibleFrom;
  }

  // 해당 월에 체크(또는 방문날짜 기록)가 하나라도 있는지 - raw 기록 기준(1회성 여부와 무관)
  function hasActivityThisMonth(p, mkey){
    var found = false;
    forEachItem(p, function(cat, g, it, key){
      if(found) return;
      var d = getItemMonthData(p.id, key, mkey);
      if(it.type === "check"){ if(d && d.checked) found = true; }
      else { if(d && d.dates && d.dates.length > 0) found = true; }
    });
    return found;
  }

  // 가나다순 정렬, 단 이번 달 활동이 있는 환자를 상단으로
  function sortPatientsForDisplay(list, mkey){
    var withActivity = [], rest = [];
    list.forEach(function(p){ (hasActivityThisMonth(p, mkey) ? withActivity : rest).push(p); });
    function byName(a,b){ return (a.name||"").localeCompare(b.name||"", "ko"); }
    withActivity.sort(byName);
    rest.sort(byName);
    return withActivity.concat(rest);
  }

  // 환자 상태 객체를 안전하게 반환(없으면 즉시 생성). 데이터가 꼬여도 화면이 죽지 않도록 함.
  function ensurePatientState(pid){
    if(!S.patientStates[pid] || typeof S.patientStates[pid] !== "object"){
      S.patientStates[pid] = { items:{} };
    }
    if(!S.patientStates[pid].items || typeof S.patientStates[pid].items !== "object"){
      S.patientStates[pid].items = {};
    }
    return S.patientStates[pid];
  }

  function getItemMonthData(pid, key, mkey){
    var st = ensurePatientState(pid);
    if(!st.items[key]) return null;
    return st.items[key][mkey] || null;
  }

  /* ---- 필수항목(고정방문 유형별) 판정 ---- */
  // startMonths에 값이 없으면 "시작월 미정"으로 보고 null을 반환합니다 (createdAt으로 임의 대체하지 않음).
  function getCategoryStartMonth(p, cat){
    if(p.startMonths && p.startMonths[cat]) return p.startMonths[cat];
    return null;
  }
  // mkey가 시작월보다 이전이거나, 시작월 자체가 미정이면 null(집계 제외)
  function getPhase(p, cat, mkey){
    var start = getCategoryStartMonth(p, cat);
    if(!start) return null;                // 시작월 미정
    if(mkey < start) return null;          // 시작 전
    if(mkey === start) return "first";     // 첫 방문달
    return "after";                        // 첫 방문달 이후
  }
  function isItemRequired(it, phase){
    if(!it.req || !phase) return false;
    return !!it.req[phase];
  }
  // 1회성 항목(예: 동의서): 어느 달에 체크했든 유효함. 체크된 달 중 가장 이른 달의 기록을 반환.
  function findOnceRecord(pid, key){
    var st = ensurePatientState(pid);
    if(!st.items[key]) return null;
    var months = Object.keys(st.items[key]).filter(function(mk){
      var d = st.items[key][mk];
      return d && d.checked;
    });
    if(months.length === 0) return null;
    months.sort();
    return { mkey: months[0], data: st.items[key][months[0]] };
  }
  // 방문유형에 따라 어느 구분·그룹의 "방문 날짜" 로그에 자동으로 반영할지
  function getSyncTargetForVisitType(visitType){
    if(visitType === "일방시" || visitType === "일방시(의사단독)") return { cat:"일방시", group:"방문" };
    if(visitType === "추가간호") return { cat:"재택", group:"추가간호" };
    return null;
  }
  // 방문 등록/수정시 체크리스트의 "방문 날짜" 로그에 그 날짜를 자동으로 추가
  async function addSyncedChecklistDate(no, cat, group, dateStr){
    if(!no || !dateStr) return;
    var patient = S.patients.find(function(p){ return String(p.no) === String(no); });
    if(!patient) return;
    var key = cat+"|"+group+"|방문 날짜";
    var mkey = dateStr.slice(0,7);
    var st = ensurePatientState(patient.id);
    if(!st.items[key]) st.items[key] = {};
    if(!st.items[key][mkey]) st.items[key][mkey] = { dates:[] };
    if(st.items[key][mkey].dates.indexOf(dateStr) === -1){
      st.items[key][mkey].dates.push(dateStr);
      st.items[key][mkey].dates.sort();
      await saveAllPatientStates();
    }
  }
  // 방문이 수정/삭제되어 더 이상 해당 날짜가 유효하지 않게 되면 체크리스트에서도 제거
  async function removeSyncedChecklistDate(no, cat, group, dateStr){
    if(!no || !dateStr) return;
    var patient = S.patients.find(function(p){ return String(p.no) === String(no); });
    if(!patient) return;
    var key = cat+"|"+group+"|방문 날짜";
    var mkey = dateStr.slice(0,7);
    var st = ensurePatientState(patient.id);
    if(st.items[key] && st.items[key][mkey]){
      var idx = st.items[key][mkey].dates.indexOf(dateStr);
      if(idx !== -1){
        st.items[key][mkey].dates.splice(idx,1);
        await saveAllPatientStates();
      }
    }
  }

  // 방문목록에서 MINT 일방시 체크가 하나라도 된 방문이 이번달에 있으면 충족으로 봄 (자동 연동 전용)
  function isMintSyncedFromVisits(p, mkey){
    var list = S.visitsCache[mkey];
    if(!list || !p.no) return false;
    return list.some(function(v){ return String(v.no) === String(p.no) && v.mintVisit; });
  }
  function isItemSatisfied(p, cat, group, it, mkey){
    if(it.syncFromVisit){ return isMintSyncedFromVisits(p, mkey); }
    var key = cat+"|"+group+"|"+it.name;
    if(it.type === "check"){
      if(it.once) return !!findOnceRecord(p.id, key);
      var d = getItemMonthData(p.id, key, mkey);
      return !!(d && d.checked);
    }
    var ld = getItemMonthData(p.id, key, mkey);
    return !!(ld && ld.dates && ld.dates.length > 0);
  }
  // 환자의 특정 구분(cat)에 대해 이번달 필수항목 충족 현황을 계산
  // 반환: null(시작 전, 집계 제외) 또는 {required, done, missing:[{group,name}]}
  function computeCategoryStatus(p, cat, mkey){
    var phase = getPhase(p, cat, mkey);
    if(!phase) return null;
    var groups = S.templates[cat] || [];
    var required = 0, done = 0, missing = [];
    groups.forEach(function(g){
      g.items.forEach(function(it){
        if(!isItemRequired(it, phase)) return;
        required++;
        if(isItemSatisfied(p, cat, g.group, it, mkey)) done++;
        else missing.push({group:g.group, name:it.name});
      });
    });
    return { phase:phase, required:required, done:done, missing:missing, satisfied: missing.length===0 };
  }

  // 특정 그룹(예: 동의서, 재택서식) 하나에 대해서만 필수항목 충족 여부 계산
  function computeGroupStatus(p, cat, group, mkey){
    var phase = getPhase(p, cat, mkey);
    if(!phase) return null;
    var required = 0, done = 0;
    group.items.forEach(function(it){
      if(!isItemRequired(it, phase)) return;
      required++;
      if(isItemSatisfied(p, cat, group.group, it, mkey)) done++;
    });
    return { required:required, done:done, satisfied: required===0 ? true : (done===required) };
  }
  // 그룹의 모든 항목이 "날짜기록형이면서 필수가 아님"이면(예: 추가간호) 완료건수 합계로 표시
  function groupIsOptionalLog(group){
    return group.items.length > 0 && group.items.every(function(it){
      return it.type === "log" && (!it.req || (!it.req.first && !it.req.after));
    });
  }
  function getGroupLogCount(p, cat, group, mkey){
    var sum = 0;
    group.items.forEach(function(it){
      if(it.type !== "log") return;
      var key = cat+"|"+group.group+"|"+it.name;
      var d = getItemMonthData(p.id, key, mkey);
      if(d && d.dates) sum += d.dates.length;
    });
    return sum;
  }

  // 특정 구분(재택/일방시/장주사)의 상황판 HTML 생성: 그룹별 요약 + 환자별 O/X 표
  function buildCategoryBoard(cat, mkey){
    var groups = S.templates[cat] || [];
    var activePatients = getNurseFilteredPatients().filter(function(p){
      return (p.categories||[]).indexOf(cat) !== -1
        && getPhase(p, cat, mkey) !== null
        && patientCategoryVisitedThisMonth(p, cat, mkey);
    });

    var summaryHtml = '<div style="font-size:11px;color:var(--ink-soft);margin-bottom:6px;">이번달 방문목록에 있는 '+escapeHtml(cat)+' 환자 '+activePatients.length+'명 기준</div>';
    summaryHtml += '<div class="board-summary">';
    groups.forEach(function(g){
      if(groupIsOptionalLog(g)){
        var total = 0;
        activePatients.forEach(function(p){ total += getGroupLogCount(p, cat, g, mkey); });
        summaryHtml += '<div class="board-metric"><div class="board-metric-label">'+escapeHtml(g.group)+'</div><div class="board-metric-value">완료 '+total+'건</div></div>';
      } else {
        var done = 0;
        activePatients.forEach(function(p){
          var gs = computeGroupStatus(p, cat, g, mkey);
          if(gs && gs.satisfied) done++;
        });
        summaryHtml += '<div class="board-metric"><div class="board-metric-label">'+escapeHtml(g.group)+'</div><div class="board-metric-value">'+done+'/'+activePatients.length+'</div></div>';
      }
    });
    summaryHtml += '</div>';

    var sortedPatients = activePatients.slice().sort(function(a,b){ return (a.name||"").localeCompare(b.name||"", "ko"); });
    var tableHtml = '<div class="assign-table-wrap" style="margin-top:10px;"><table class="assign-table"><thead><tr><th>이름</th>' +
      groups.map(function(g){ return '<th>'+escapeHtml(g.group)+'</th>'; }).join("") +
    '</tr></thead><tbody>';

    if(sortedPatients.length === 0){
      tableHtml += '<tr><td colspan="'+(groups.length+1)+'" style="text-align:center;color:var(--ink-soft);padding:16px;">이번달 활성화된 '+escapeHtml(cat)+' 환자가 없습니다.</td></tr>';
    } else {
      sortedPatients.forEach(function(p){
        tableHtml += '<tr class="board-patient-row" data-pid="'+p.id+'"><td style="font-weight:600;">'+escapeHtml(p.name)+'</td>';
        groups.forEach(function(g){
          if(groupIsOptionalLog(g)){
            tableHtml += '<td style="text-align:center;">'+getGroupLogCount(p, cat, g, mkey)+'</td>';
          } else {
            var gs = computeGroupStatus(p, cat, g, mkey);
            var ok = gs && gs.satisfied;
            tableHtml += '<td style="text-align:center;" class="'+(ok?'visit-check-yes':'visit-check-no')+'">'+(ok?'O':'X')+'</td>';
          }
        });
        tableHtml += '</tr>';
      });
    }
    tableHtml += '</tbody></table></div>';

    return summaryHtml + tableHtml;
  }

  async function setCheckItem(pid, key, mkey, checked){
    var st = ensurePatientState(pid);
    if(!st.items[key]) st.items[key] = {};
    if(checked){
      var byName = (SESSION && SESSION.name) ? SESSION.name : (S.who || "미지정");
      st.items[key][mkey] = { checked:true, date: todayStr(), by: byName };
    } else {
      delete st.items[key][mkey];
    }
    await saveAllPatientStates();
  }

  async function addLogDate(pid, key, mkey, dateStr){
    var st = ensurePatientState(pid);
    if(!st.items[key]) st.items[key] = {};
    if(!st.items[key][mkey]) st.items[key][mkey] = { dates: [] };
    st.items[key][mkey].dates.push(dateStr || todayStr());
    st.items[key][mkey].dates.sort();
    await saveAllPatientStates();
  }
  async function removeLogDate(pid, key, mkey, idx){
    var st = ensurePatientState(pid);
    if(st.items[key] && st.items[key][mkey]){
      st.items[key][mkey].dates.splice(idx,1);
    }
    await saveAllPatientStates();
  }

  /* ================= 렌더 : 대시보드 ================= */
  function buildCompletionStats(mkey){
    var overall = {}; CATS.forEach(function(c){ overall[c] = {done:0, total:0}; });
    var byNurse = {}; // nurse -> {cat:{done,total}}
    var missingList = []; // {p, cat, missing:[{group,name}]}

    S.patients.forEach(function(p){
      var nurse = p.nurse || "미배정";
      if(!byNurse[nurse]){ byNurse[nurse]={}; CATS.forEach(function(c){ byNurse[nurse][c]={done:0,total:0}; }); }
      (p.categories||[]).forEach(function(cat){
        if(!patientCategoryVisitedThisMonth(p, cat, mkey)) return; // 그 구분으로 이번달 방문이 없으면 집계 제외
        var status = computeCategoryStatus(p, cat, mkey);
        if(!status) return; // 시작 전
        overall[cat].total++;
        byNurse[nurse][cat].total++;
        if(status.satisfied){
          overall[cat].done++;
          byNurse[nurse][cat].done++;
        } else {
          missingList.push({ p:p, cat:cat, missing:status.missing });
        }
      });
    });
    return { overall:overall, byNurse:byNurse, missingList:missingList };
  }

  function renderDashboard(){
    var mkey = monthKey(S.year, S.month);
    var stats = buildCompletionStats(mkey);

    var visibleCount = getNurseFilteredPatients().filter(isPatientVisibleForCurrentView).length;
    var scoped = (S.who === "전체") ? stats.overall : (stats.byNurse[S.who] || {});

    document.getElementById("statPatients").textContent = visibleCount;
    CATS.forEach(function(c){
      var v = scoped[c] || {done:0, total:0};
      var elId = c === "재택" ? "statHome" : (c === "일방시" ? "statVisit" : "statDisability");
      document.getElementById(elId).textContent = v.done + "/" + v.total;
    });

    document.querySelectorAll(".dash-stat-clickable").forEach(function(el){
      el.classList.toggle("selected", el.getAttribute("data-cat") === S.dashboardCategory);
    });

    var body = document.getElementById("dashboardBody");

    if(!S.dashboardCategory){
      body.innerHTML = '<div class="empty-note">위에서 재택 · 일방시 · 장주사 중 하나를 눌러 상황판을 확인하세요.</div>';
      return;
    }

    var html = buildCategoryBoard(S.dashboardCategory, mkey);

    if(S.adminMode){
      var nurses = Object.keys(stats.byNurse).sort(function(a,b){ return a.localeCompare(b,"ko"); });
      var tableRows = nurses.map(function(n){
        var v = stats.byNurse[n][S.dashboardCategory];
        var text = v.total>0 ? (v.done+"/"+v.total) : "–";
        return '<tr><td style="padding:5px 6px;font-weight:600;">'+escapeHtml(n)+'</td>' +
          '<td style="padding:5px 6px;text-align:center;font-variant-numeric:tabular-nums;">'+text+'</td></tr>';
      }).join("");
      html += '<div style="font-size:12.5px;font-weight:700;color:var(--ink-soft);margin:16px 0 6px;">간호사별 '+S.dashboardCategory+' 필수항목 충족 현황</div>' +
        '<table style="width:100%;border-collapse:collapse;font-size:12.5px;">' +
          '<thead><tr style="border-bottom:1px solid var(--line-soft);">' +
            '<th style="text-align:left;padding:4px 6px;color:var(--ink-soft);font-weight:600;">간호사</th>' +
            '<th style="padding:4px 6px;color:var(--ink-soft);font-weight:600;">완료/전체</th>' +
          '</tr></thead>' +
          '<tbody>'+ (tableRows || '<tr><td colspan="2" style="padding:8px 6px;color:var(--ink-soft);">등록된 간호사가 없습니다.</td></tr>') +'</tbody>' +
        '</table>';
    }

    body.innerHTML = html;

    body.querySelectorAll(".board-patient-row").forEach(function(tr){
      tr.addEventListener("click", function(){
        var pid = tr.getAttribute("data-pid");
        S.openPatients[pid] = true;
        renderAll();
        var target = document.querySelector('[data-patient-card="'+pid+'"]');
        if(target) target.scrollIntoView({behavior:"smooth", block:"start"});
      });
    });
  }

  /* ================= 렌더 : 환자 목록 ================= */
  function escapeHtml(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  // 환자 카드 헤더에 표시할 구분별 필수항목 상태칩 데이터
  function patientCategoryChips(p){
    var mkey = monthKey(S.year, S.month);
    return (p.categories||[]).map(function(cat){
      if(!patientCategoryVisitedThisMonth(p, cat, mkey)){
        return { cat:cat, state:"unvisited", label: cat+" 미방문" };
      }
      var status = computeCategoryStatus(p, cat, mkey);
      if(!status){
        var start = getCategoryStartMonth(p, cat);
        var label = start ? (cat+" 시작전") : (cat+" 시작월 미정");
        return { cat:cat, state: start ? "pending" : "needinfo", label:label };
      }
      if(status.required === 0){
        return { cat:cat, state:"none", label:cat };
      }
      return {
        cat:cat,
        state: status.satisfied ? "done" : "missing",
        label: cat + " 필수 " + status.done + "/" + status.required
      };
    });
  }

  function buildMonthBody(p, mkey){
    if(!p.categories || p.categories.length === 0){
      return '<div class="no-category-note">배정된 시범사업 구분이 없습니다. 관리자 모드에서 수정해주세요.</div>';
    }
    var visitedCats = p.categories.filter(function(cat){ return patientCategoryVisitedThisMonth(p, cat, mkey); });
    if(visitedCats.length === 0){
      return '<div class="no-category-note">이번달 방문목록에 이 환자의 방문 기록이 아직 없어, 체크항목이 표시되지 않습니다.<br>방문목록 탭에서 방문을 등록하면 해당 구분의 체크항목이 나타납니다.</div>';
    }
    var mParts = mkey.split("-");
    var mYear = parseInt(mParts[0],10), mMonthNum = parseInt(mParts[1],10);
    var monthMin = mkey + "-01";
    var monthMax = mkey + "-" + pad2(new Date(mYear, mMonthNum, 0).getDate());
    var todayInThisMonth = todayStr() >= monthMin && todayStr() <= monthMax;
    var defaultLogDate = todayInThisMonth ? todayStr() : monthMin;

    var body = "";
    visitedCats.forEach(function(cat){
      var groups = S.templates[cat] || [];
      var phase = getPhase(p, cat, mkey);
      var phaseLabel = phase === "first" ? "이번달 첫 방문달" : (phase === "after" ? "첫 방문달 이후" : (getCategoryStartMonth(p,cat) ? "시작 전" : "시작월 미정"));
      body += '<div class="category-block cat-'+cat+'">' +
        '<div class="category-title"><span class="category-bar"></span><span class="'+'cat-'+cat+'-text'+'">'+cat+'</span>' +
        '<span style="font-weight:400;color:var(--ink-soft);font-size:11px;">'+phaseLabel+'</span></div>';
      groups.forEach(function(g){
        var titleCls = g.group === "단독간호" ? "tag-solo" : (g.group === "추가간호" ? "tag-extra" : "");
        var proxyNote = buildProxyNoteForGroup(p, cat, g.group, mkey);
        body += '<div class="group-block"><div class="group-title '+titleCls+'">'+escapeHtml(g.group)+proxyNote+'</div>';
        (g.items || []).forEach(function(it){
          var key = cat+"|"+g.group+"|"+it.name;
          var required = isItemRequired(it, phase);
          var reqTag = required ? '<span class="req-tag">필수</span>' : '';
          if(it.type === "check"){
            if(it.syncFromVisit){
              var syncedChecked = isMintSyncedFromVisits(p, mkey);
              body += '<div class="item-row">' +
                '<input type="checkbox" class="chk" disabled '+(syncedChecked?'checked':'')+'>' +
                '<div class="item-main">' +
                  '<div class="item-label">'+escapeHtml(it.name)+reqTag+' <span style="font-size:10.5px;color:var(--ink-soft);">(이번달 방문목록에서 자동연동)</span></div>' +
                '</div>' +
              '</div>';
              return;
            }
            var d, recordMkey;
            if(it.once){
              var rec = findOnceRecord(p.id, key);
              d = rec ? rec.data : null;
              recordMkey = rec ? rec.mkey : mkey;
            } else {
              d = getItemMonthData(p.id, key, mkey);
              recordMkey = mkey;
            }
            var checked = !!(d && d.checked);
            var onceNote = (it.once && checked) ? '<span style="color:var(--ink-soft);">(1회성)</span> ' : '';
            body += '<div class="item-row">' +
              '<input type="checkbox" class="chk" data-act="check" data-pid="'+p.id+'" data-key="'+encodeURIComponent(key)+'" data-mkey="'+mkey+'" '+(checked?'checked':'')+'>' +
              '<div class="item-main">' +
                '<div class="item-label">'+escapeHtml(it.name)+reqTag+'</div>' +
                (checked && S.adminMode ? '<div class="item-meta">'+onceNote+fmtFull(d.date)+' 완료 · '+escapeHtml(d.by)+
                  '<button data-act="uncheck" data-pid="'+p.id+'" data-key="'+encodeURIComponent(key)+'" data-mkey="'+recordMkey+'">취소</button></div>' : '') +
              '</div>' +
            '</div>';
          } else {
            var ld = getItemMonthData(p.id, key, mkey);
            var dates = (ld && ld.dates) ? ld.dates : [];
            body += '<div class="item-row log-row">' +
              '<div class="item-main">' +
                '<div class="item-label">'+escapeHtml(it.name)+reqTag+'</div>' +
                '<div style="display:flex;align-items:center;gap:6px;margin-top:5px;">' +
                  '<input type="date" class="log-date-input" min="'+monthMin+'" max="'+monthMax+'" value="'+defaultLogDate+'" data-pid="'+p.id+'" data-key="'+encodeURIComponent(key)+'">' +
                  '<button class="log-add" data-act="addlog" data-pid="'+p.id+'" data-key="'+encodeURIComponent(key)+'">+ 날짜 추가</button>' +
                '</div>' +
                '<div class="log-chips">' +
                  dates.map(function(ds, idx){
                    var proxyNurse = findProxyNurseForDate(p, cat, g.group, ds, mkey);
                    var proxyLabel = proxyNurse ? ' <span style="color:var(--warn);font-weight:700;">('+escapeHtml(proxyNurse)+')</span>' : '';
                    return '<span class="chip">'+fmtMD(ds)+proxyLabel+
                      '<button data-act="rmlog" data-pid="'+p.id+'" data-key="'+encodeURIComponent(key)+'" data-idx="'+idx+'">×</button></span>';
                  }).join("") +
                '</div>' +
              '</div>' +
            '</div>';
          }
        });
        body += '</div>';
      });
      body += '</div>';
    });
    return body;
  }

  // 연간 보기: 구글 시트처럼 항목 x 1~12월 매트릭스로 표시 (읽기 전용, 셀 클릭시 해당 월로 이동)
  function buildYearBody(p, year){
    if(!p.categories || p.categories.length === 0){
      return '<div class="no-category-note">배정된 시범사업 구분이 없습니다. 관리자 모드에서 수정해주세요.</div>';
    }
    var monthsHtml = "";
    for(var m=1;m<=12;m++){ monthsHtml += '<th>'+m+'월</th>'; }

    var rows = "";
    p.categories.forEach(function(cat){
      var groups = S.templates[cat] || [];
      rows += '<tr class="ycat-row"><td class="yname '+'cat-'+cat+'-text'+'" colspan="13">'+escapeHtml(cat)+'</td></tr>';
      groups.forEach(function(g){
        var titleCls = g.group === "단독간호" ? "tag-solo" : (g.group === "추가간호" ? "tag-extra" : "");
        rows += '<tr class="ygroup-row"><td class="yname '+titleCls+'" colspan="13">'+escapeHtml(g.group)+'</td></tr>';
        g.items.forEach(function(it){
          var key = cat+"|"+g.group+"|"+it.name;
          rows += '<tr><td class="yname">'+escapeHtml(it.name)+'</td>';
          for(var mm=1; mm<=12; mm++){
            var mk = monthKey(year, mm);
            var cellHtml = "";
            if(it.type === "check"){
              var d = getItemMonthData(p.id, key, mk);
              if(d && d.checked){ cellHtml = '<span class="year-check" title="'+escapeHtml(d.date+' · '+(d.by||""))+'">✓</span>'; }
            } else {
              var ld = getItemMonthData(p.id, key, mk);
              if(ld && ld.dates && ld.dates.length){
                cellHtml = '<span class="year-dates">'+ld.dates.map(fmtMD).join(", ")+'</span>';
              }
            }
            rows += '<td class="ycell" data-act="gotomonth" data-pid="'+p.id+'" data-year="'+year+'" data-month="'+mm+'">'+cellHtml+'</td>';
          }
          rows += '</tr>';
        });
      });
    });

    return '<div class="year-scroll"><table class="year-table">' +
      '<thead><tr><th class="yname">항목</th>'+monthsHtml+'</tr></thead>' +
      '<tbody>'+rows+'</tbody>' +
    '</table></div>';
  }

  function renderOnePatientCard(p, mkey, isYear){
    var isOpen = !!S.openPatients[p.id];
    var badges;
    if(isYear){
      badges = p.categories.map(function(c){ return '<span class="badge badge-'+c+'">'+c+'</span>'; }).join("");
    } else {
      var chips = patientCategoryChips(p);
      badges = chips.map(function(c){
        var stateClass = c.state==="done" ? "chip-done" : (c.state==="missing" ? "chip-missing" : (c.state==="needinfo" ? "chip-needinfo" : (c.state==="unvisited" ? "chip-unvisited" : "chip-pending")));
        return '<span class="badge badge-'+c.cat+' '+stateClass+'">'+escapeHtml(c.label)+'</span>';
      }).join("");
      if(p.isVirtual){ badges += '<span class="badge badge-미지정">환자배정 미등록</span>'; }
    }

    var body = isYear ? buildYearBody(p, S.year) : buildMonthBody(p, mkey);

    var footer = p.isVirtual
      ? '<div style="padding:10px 14px;display:flex;gap:8px;align-items:center;">' +
          '<button class="btn btn-sm btn-teal" data-act="registerpatient" data-pid="'+p.id+'" data-no="'+escapeHtml(p.no||"")+'" data-name="'+escapeHtml(p.name||"")+'">환자배정에 등록하기</button>' +
          '<span style="font-size:11.5px;color:var(--ink-soft);">등록 전까지의 체크 기록은 임시 보관되며, 정식 등록 후에는 별도로 이관해야 할 수 있습니다.</span>' +
        '</div>'
      : '<div style="padding:10px 14px;display:flex;gap:8px;">' +
          '<button class="btn btn-sm" data-act="editpatient" data-pid="'+p.id+'">환자정보 수정</button>' +
          (S.adminMode ? '<button class="btn btn-sm" style="color:var(--warn);border-color:var(--warn);" data-act="delpatient" data-pid="'+p.id+'">환자 삭제</button>' : '') +
        '</div>';

    return '<div class="patient '+(isOpen?'open':'')+(p.isVirtual?' virtual-patient':'')+'" data-patient-card="'+p.id+'">' +
      '<div class="patient-head" data-act="toggle" data-pid="'+p.id+'">' +
        '<span class="chev">▸</span>' +
        '<span class="patient-id">#'+escapeHtml(p.no||"")+'</span>' +
        '<span class="patient-name">'+escapeHtml(p.name)+'</span>' +
        '<span class="patient-badges">'+badges+'</span>' +
      '</div>' +
      '<div class="patient-body">' + body + footer + '</div>' +
    '</div>';
  }

  function patientHasVisitThisMonth(p, mkey){
    var list = S.visitsCache[mkey];
    if(!list || !p.no) return false;
    return list.some(function(v){ return String(v.no) === String(p.no); });
  }
  // 담당간호사가 아니더라도, 이번달에 그 간호사가 실제로 이 환자를 방문했는지
  function hasVisitByNurseThisMonth(p, nurseName, mkey){
    var list = S.visitsCache[mkey];
    if(!list || !p.no || !nurseName) return false;
    return list.some(function(v){ return String(v.no) === String(p.no) && v.nurse === nurseName; });
  }
  // 현재 선택된 간호사 보기(S.who) 기준으로 체크리스트에 노출할 기본 환자 목록을 구성합니다.
  // - 전체/의사(전용우) 보기: 등록된 모든 환자
  // - 특정 간호사 보기: 그 간호사가 담당인 환자 + (담당은 아니지만 이번달 그 간호사가 실제로 방문한 환자)
  function buildChecklistBaseList(mkey){
    if(S.who === "전체" || S.who === DOCTOR_NAME){
      return S.patients.filter(isPatientVisibleForCurrentView);
    }
    return S.patients.filter(function(p){
      if(!isPatientVisibleForCurrentView(p)) return false;
      if(p.nurse === S.who) return true;
      if(!p.nurse && hasVisitByNurseThisMonth(p, S.who, mkey)) return true;
      return false;
    });
  }

  // 환자배정(S.patients)에 아예 등록되어 있지 않은데, 이번달 방문목록에는 기록이 있는 사람들을
  // "가상 환자" 객체로 만들어, 정식 환자와 동일한 카드·체크리스트로 보여줄 수 있게 합니다.
  // 구분은 이번달 방문유형에서 추론하고, 이번달을 첫 방문달로 취급합니다.
  function getOrphanVisitsThisMonth(mkey){
    var list = S.visitsCache[mkey];
    if(!list) return [];
    var isSpecificNurse = (S.who !== "전체" && S.who !== DOCTOR_NAME);
    var seen = {};
    var result = [];
    list.forEach(function(v){
      if(!v.no) return;
      var registered = S.patients.some(function(p){ return String(p.no) === String(v.no); });
      if(registered) return;
      if(isSpecificNurse && v.nurse !== S.who) return;
      if(seen[v.no]) return;
      seen[v.no] = true;

      var catsForNo = {};
      list.forEach(function(v2){
        if(String(v2.no) !== String(v.no)) return;
        var cat = VISIT_TYPE_TO_CATEGORY[v2.visitType];
        if(cat) catsForNo[cat] = true;
      });
      var categories = Object.keys(catsForNo);
      var startMonths = {};
      categories.forEach(function(c){ startMonths[c] = mkey; });

      result.push({
        id: "virtual_" + v.no,
        no: v.no,
        name: v.name,
        nurse: "",
        categories: categories,
        startMonths: startMonths,
        isVirtual: true
      });
    });
    return result;
  }

  function renderPatientList(){
    var wrap = document.getElementById("patientList");
    if(S.patients.length === 0){
      wrap.innerHTML = '<div class="empty-state">등록된 환자가 없습니다.<br>위의 “새 환자 등록” 버튼으로 시작해보세요.</div>';
      return;
    }
    var mkey = monthKey(S.year, S.month);
    var isYear = S.viewMode === "year";

    var baseList = buildChecklistBaseList(mkey);

    if(baseList.length === 0){
      wrap.innerHTML = '<div class="empty-state">' +
        (S.who === "전체" ? "이 기간에 표시할 환자가 없습니다." : (escapeHtml(S.who) + " 님과 관련된 환자 중 이 기간에 표시할 환자가 없습니다.")) +
      '</div>';
      return;
    }

    function byName(a,b){ return (a.name||"").localeCompare(b.name||"", "ko"); }

    if(isYear){
      // 연간 보기에서는 구분 없이 가나다순 단일 목록
      var yearList = baseList.slice().sort(byName);
      wrap.innerHTML = yearList.map(function(p){ return renderOnePatientCard(p, mkey, true); }).join("");
      bindPatientListEvents();
      return;
    }

    var topList = baseList.filter(function(p){ return patientHasVisitThisMonth(p, mkey); }).sort(byName);
    var bottomList = baseList.filter(function(p){ return !patientHasVisitThisMonth(p, mkey); }).sort(byName);

    if(S.checklistTopSearch){
      topList = topList.filter(function(p){ return (p.name||"").indexOf(S.checklistTopSearch) !== -1; });
    }

    var isSpecificNurse = (S.who !== "전체" && S.who !== DOCTOR_NAME);
    var topAssigned = topList.filter(function(p){ return isSpecificNurse ? (p.nurse === S.who) : !!p.nurse; });
    var topUnassignedReal = topList.filter(function(p){ return !p.nurse; });
    var orphanVisits = getOrphanVisitsThisMonth(mkey);
    if(S.checklistTopSearch){
      orphanVisits = orphanVisits.filter(function(o){ return (o.name||"").indexOf(S.checklistTopSearch) !== -1; });
    }
    var totalTopCount = topList.length + orphanVisits.length;
    var totalUnassignedCount = topUnassignedReal.length + orphanVisits.length;

    var html = '<div class="checklist-section-header section-visited">' +
        '<span>● 이번달 방문목록에 있음 (' + totalTopCount + '명)</span>' +
        '<input type="text" id="checklistTopSearchInput" class="tf-input" style="max-width:160px;" placeholder="이름 검색" value="'+escapeHtml(S.checklistTopSearch||"")+'">' +
      '</div>';

    if(totalTopCount){
      html += '<div class="checklist-two-col">' +
        '<div class="checklist-col col-assigned">' +
          '<div class="checklist-subsection-header sub-assigned">담당환자방문 (' + topAssigned.length + '명)</div>' +
          (topAssigned.length
            ? topAssigned.map(function(p){ return renderOnePatientCard(p, mkey, false); }).join("")
            : '<div class="empty-note" style="padding:8px 4px;">해당 없음</div>') +
        '</div>' +
        '<div class="checklist-col col-unassigned">' +
          '<div class="checklist-subsection-header sub-unassigned">비담당환자방문 (' + totalUnassignedCount + '명)</div>' +
          (totalUnassignedCount
            ? topUnassignedReal.map(function(p){ return renderOnePatientCard(p, mkey, false); }).join("") +
              orphanVisits.map(function(o){ return renderOnePatientCard(o, mkey, false); }).join("")
            : '<div class="empty-note" style="padding:8px 4px;">해당 없음</div>') +
        '</div>' +
      '</div>';
    } else {
      html += '<div class="empty-note" style="padding:10px 4px;">이번달 방문목록에 아직 아무도 없습니다.</div>';
    }

    html += '<div class="checklist-section-divider"></div>';
    html += '<div class="checklist-section-header section-novisit"><span>○ 이번달 방문목록에 없음 (' + bottomList.length + '명)</span></div>';
    html += bottomList.length
      ? bottomList.map(function(p){ return renderOnePatientCard(p, mkey, false); }).join("")
      : '<div class="empty-note" style="padding:10px 4px;">전부 이번달 방문목록에 올라와 있습니다.</div>';

    wrap.innerHTML = html;

    var searchInput = document.getElementById("checklistTopSearchInput");
    if(searchInput){
      searchInput.addEventListener("click", function(ev){ ev.stopPropagation(); });
      searchInput.addEventListener("keydown", function(e){
        if(e.key !== "Enter") return;
        e.preventDefault();
        S.checklistTopSearch = e.target.value.trim();
        renderPatientList();
      });
    }

    bindPatientListEvents();
  }

  function bindPatientListEvents(){
    var wrap = document.getElementById("patientList");
    wrap.querySelectorAll('[data-act="toggle"]').forEach(function(el){
      el.addEventListener("click", function(){
        var pid = el.getAttribute("data-pid");
        S.openPatients[pid] = !S.openPatients[pid];
        renderPatientList();
      });
    });
    wrap.querySelectorAll('[data-act="check"]').forEach(function(el){
      el.addEventListener("click", async function(ev){
        ev.stopPropagation();
        var pid = el.getAttribute("data-pid");
        var key = decodeURIComponent(el.getAttribute("data-key"));
        var mkey = el.getAttribute("data-mkey") || monthKey(S.year, S.month);
        await setCheckItem(pid, key, mkey, el.checked);
        renderAll();
      });
    });
    wrap.querySelectorAll('[data-act="uncheck"]').forEach(function(el){
      el.addEventListener("click", async function(ev){
        ev.stopPropagation();
        var pid = el.getAttribute("data-pid");
        var key = decodeURIComponent(el.getAttribute("data-key"));
        var mkey = el.getAttribute("data-mkey") || monthKey(S.year, S.month);
        await setCheckItem(pid, key, mkey, false);
        renderAll();
      });
    });
    wrap.querySelectorAll('[data-act="addlog"]').forEach(function(el){
      el.addEventListener("click", async function(ev){
        ev.stopPropagation();
        var pid = el.getAttribute("data-pid");
        var key = decodeURIComponent(el.getAttribute("data-key"));
        var mkey = monthKey(S.year, S.month);
        var dateInput = el.previousElementSibling; // .log-date-input
        var chosenDate = (dateInput && dateInput.value) ? dateInput.value : todayStr();
        await addLogDate(pid, key, mkey, chosenDate);
        renderAll();
      });
    });
    wrap.querySelectorAll('[data-act="rmlog"]').forEach(function(el){
      el.addEventListener("click", async function(ev){
        ev.stopPropagation();
        var pid = el.getAttribute("data-pid");
        var key = decodeURIComponent(el.getAttribute("data-key"));
        var idx = parseInt(el.getAttribute("data-idx"),10);
        var mkey = monthKey(S.year, S.month);
        await removeLogDate(pid, key, mkey, idx);
        renderAll();
      });
    });
    wrap.querySelectorAll('[data-act="gotomonth"]').forEach(function(el){
      el.addEventListener("click", function(){
        var pid = el.getAttribute("data-pid");
        S.year = parseInt(el.getAttribute("data-year"),10);
        S.month = parseInt(el.getAttribute("data-month"),10);
        S.viewMode = "month";
        document.getElementById("viewToggle").textContent = "연간 보기";
        document.getElementById("dashboard").style.display = "";
        S.openPatients[pid] = true;
        renderMonthLabel();
        renderAll();
        var target = document.querySelector('[data-patient-card="'+pid+'"]');
        if(target) target.scrollIntoView({behavior:"smooth", block:"start"});
      });
    });
    wrap.querySelectorAll('[data-act="editpatient"]').forEach(function(el){
      el.addEventListener("click", function(ev){

        openAddPatientModal(el.getAttribute("data-pid"));

        if(ok){
          S.patients = S.patients.filter(function(x){ return x.id!==pid; });
          await storageSet(K_PATIENTS, S.patients, true);
          delete S.patientStates[pid];
          await saveAllPatientStates();
          renderAll();
          showToast("삭제되었습니다.");

      });
    });
    wrap.querySelectorAll('[data-act="registerpatient"]').forEach(function(el){
      el.addEventListener("click", function(ev){

        openAddPatientModal(null, { no: el.getAttribute("data-no"), name: el.getAttribute("data-name") });

  /* ================= 모달 공통 ================= */
  function openModal(html){
    document.getElementById("modalBody").innerHTML = html;
    document.getElementById("overlay").classList.add("show");
  }
  function closeModal(){
    document.getElementById("overlay").classList.remove("show");
    document.getElementById("modalBody").innerHTML = "";
  }
  document.getElementById("overlay").addEventListener("click", function(e){
    if(e.target.id === "overlay") closeModal();

  // 브라우저 기본 confirm()/prompt()는 이 화면(샌드박스) 환경에서 막혀 있을 수 있어
  // 화면 내부 모달로 동일한 기능을 대신합니다.
  function showConfirm(message){
    return new Promise(function(resolve){
      openModal(
        '<h3>확인해주세요</h3>' +
        '<p style="font-size:14px;line-height:1.6;">'+escapeHtml(message)+'</p>' +
        '<div class="modal-actions">' +
          '<button class="btn" id="confirmNo">취소</button>' +
          '<button class="btn" style="background:var(--warn);border-color:var(--warn);color:#fff;" id="confirmYes">확인</button>' +
        '</div>'
      );
      document.getElementById("confirmNo").onclick = function(){ closeModal(); resolve(false); };
      document.getElementById("confirmYes").onclick = function(){ closeModal(); resolve(true); };
    });
  }
  // 다른 모달(환자 등록 등) 위에 겹쳐서 띄우는 보조 입력창. 기존 모달 내용을 지우지 않음.
  // 드롭다운 선택형 중첩 프롬프트. options: [{value,label}], 반환값은 선택값 또는 취소시 null.
  function showSelectPrompt(label, options, defaultValue){
    return new Promise(function(resolve){
      var div = document.createElement("div");
      div.className = "overlay show";
      div.style.zIndex = 90;
      var optsHtml = '<option value="">선택 안 함</option>' + options.map(function(o){
        return '<option value="'+escapeHtml(o.value)+'" '+(o.value===defaultValue?"selected":"")+'>'+escapeHtml(o.label)+'</option>';
      }).join("");
      div.innerHTML = '<div class="modal" style="max-width:360px;">' +
          '<h3>'+escapeHtml(label)+'</h3>' +
          '<div class="field"><select id="nestedSelectInput">'+optsHtml+'</select></div>' +
          '<div class="modal-actions">' +
            '<button class="btn" id="nestedSelectCancel">취소</button>' +
            '<button class="btn btn-teal" id="nestedSelectOk">확인</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(div);
      div.querySelector("#nestedSelectCancel").onclick = function(){ div.remove(); resolve(null); };
      div.querySelector("#nestedSelectOk").onclick = function(){
        var v = div.querySelector("#nestedSelectInput").value;
        div.remove();
        resolve(v);
      };
    });
  }
  function showNestedPrompt(label){
    return new Promise(function(resolve){
      var div = document.createElement("div");
      div.className = "overlay show";
      div.style.zIndex = 90;
      div.innerHTML = '<div class="modal" style="max-width:360px;">' +
          '<h3>'+escapeHtml(label)+'</h3>' +
          '<div class="field"><input type="text" id="nestedPromptInput"></div>' +
          '<div class="modal-actions">' +
            '<button class="btn" id="nestedCancel">취소</button>' +
            '<button class="btn btn-teal" id="nestedOk">확인</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(div);
      var inp = div.querySelector("#nestedPromptInput");
      setTimeout(function(){ inp.focus(); }, 0);
      inp.addEventListener("keydown", function(e){ if(e.key === "Enter"){ div.querySelector("#nestedOk").click(); } });
      div.querySelector("#nestedCancel").onclick = function(){ div.remove(); resolve(null); };
      div.querySelector("#nestedOk").onclick = function(){ var v = inp.value.trim(); div.remove(); resolve(v || null); };
    });
  }
  function showPrompt(label, defaultValue){
    return new Promise(function(resolve){
      openModal(
        '<h3>'+escapeHtml(label)+'</h3>' +
        '<div class="field"><input type="text" id="promptInput" value="'+escapeHtml(defaultValue||"")+'"></div>' +
        '<div class="modal-actions">' +
          '<button class="btn" id="promptCancel">취소</button>' +
          '<button class="btn btn-teal" id="promptOk">확인</button>' +
        '</div>'
      );
      var inp = document.getElementById("promptInput");
      setTimeout(function(){ inp.focus(); }, 0);
      inp.addEventListener("keydown", function(e){ if(e.key === "Enter"){ document.getElementById("promptOk").click(); } });
      document.getElementById("promptCancel").onclick = function(){ closeModal(); resolve(null); };
      document.getElementById("promptOk").onclick = function(){
        var v = inp.value.trim();
        closeModal();
        resolve(v || null);
      };
    });
  }

  /* ================= 환자 등록 / 수정 모달 ================= */
  function openAddPatientModal(editId, prefill){
    var editing = null;
    if(editId){ editing = S.patients.find(function(x){ return x.id===editId; }); }
    var prefillNo = (!editing && prefill && prefill.no) ? prefill.no : "";
    var prefillName = (!editing && prefill && prefill.name) ? prefill.name : "";

    var staffOptions = S.staff.map(function(n){
      return '<option value="'+escapeHtml(n)+'" '+((editing&&editing.nurse===n)?'selected':'')+'>'+escapeHtml(n)+'</option>';
    }).join("");

    var defaultMonth = monthKey(S.year, S.month);
    var catRows = CATS.map(function(c){
      var checked = editing ? (editing.categories.indexOf(c)!==-1) : false;
      var startVal = (editing && editing.startMonths && editing.startMonths[c]) ? editing.startMonths[c] : defaultMonth;
      return '<div class="cat-config-row">' +
        '<label><input type="checkbox" name="cat" value="'+c+'" data-role="catchk" '+(checked?'checked':'')+'> '+c+'</label>' +
        '<input type="month" class="cat-start" data-cat="'+c+'" value="'+startVal+'" '+(checked?'':'disabled')+'>' +
      '</div>';
    }).join("");

    openModal(
      '<h3>'+(editing?'환자 정보 수정':'새 환자 등록')+'</h3>' +
      '<div class="field"><label>환자번호</label><input type="text" id="fNo" value="'+(editing?escapeHtml(editing.no):escapeHtml(prefillNo))+'" placeholder="예: 78"></div>' +
      '<div class="field"><label>이름</label><input type="text" id="fName" value="'+(editing?escapeHtml(editing.name):escapeHtml(prefillName))+'" placeholder="예: 최옥희"></div>' +
      '<div class="field"><label>시범사업 구분 · 첫 방문달 (복수 선택 가능)</label>' +
        '<p style="font-size:11.5px;color:var(--ink-soft);margin:-2px 0 6px;">첫 방문달을 기준으로 이후 달의 필수항목이 자동으로 바뀝니다.</p>' +
        catRows +
      '</div>' +
      '<div class="field"><label>담당 간호사</label><select id="fNurse">'+staffOptions+'<option value="__add__">+ 새 이름 추가</option></select></div>' +
      '<div class="field"><label>위치 (거주지역/시설명, 선택)</label><input type="text" id="fLocation" value="'+(editing?escapeHtml(editing.location||""):"")+'" placeholder="예: 남산타운"></div>' +
      '<div class="modal-actions">' +
        '<button class="btn" id="pCancel">취소</button>' +
        '<button class="btn btn-teal" id="pSave">'+(editing?'저장':'등록')+'</button>' +
      '</div>'
    );

    document.querySelectorAll('[data-role="catchk"]').forEach(function(chk){
      chk.addEventListener("change", function(){
        var row = chk.closest(".cat-config-row");
        var monthInput = row.querySelector(".cat-start");
        monthInput.disabled = !chk.checked;
      });
    });

    document.getElementById("fNurse").addEventListener("change", async function(e){
      if(e.target.value === "__add__"){
        var name = await showNestedPrompt("담당 간호사 이름을 입력해주세요.");
        var sel = document.getElementById("fNurse");
        if(name){
          name = name.trim();
          if(name && S.staff.indexOf(name)===-1){ S.staff.push(name); await storageSet(K_STAFF, S.staff, true); }
          var opt = document.createElement("option");
          opt.value = name; opt.textContent = name;
          sel.insertBefore(opt, sel.querySelector('option[value="__add__"]'));
          sel.value = name;
        } else {
          sel.value = (editing && editing.nurse) ? editing.nurse : (S.staff[0] || "");
        }
      }
    });

    document.getElementById("pCancel").onclick = closeModal;
    document.getElementById("pSave").onclick = async function(){
      var saveBtn = document.getElementById("pSave");
      if(saveBtn.disabled) return; // 저장 처리 중 중복 클릭 방지
      var no = document.getElementById("fNo").value.trim();
      var name = document.getElementById("fName").value.trim();
      var nurse = document.getElementById("fNurse").value;
      var location = document.getElementById("fLocation").value.trim();
      var cats = Array.prototype.slice.call(document.querySelectorAll('input[name="cat"]:checked')).map(function(c){ return c.value; });
      var startMonths = {};
      document.querySelectorAll(".cat-start").forEach(function(inp){
        startMonths[inp.getAttribute("data-cat")] = inp.value || monthKey(S.year, S.month);
      });

      if(!name){ showToast("이름을 입력해주세요."); return; }
      if(cats.length===0){ showToast("시범사업 구분을 한 개 이상 선택해주세요."); return; }

      // 환자번호는 이제 내부 ID로도 쓰이므로, 번호 하나당 환자 한 명만 존재해야 합니다.
      var dup = S.patients.find(function(x){
        return x.id !== (editing?editing.id:null) && no && (x.no||"") === no;
      });
      if(dup){
        showToast("환자번호 "+no+"번은 이미 "+dup.name+" 님으로 등록되어 있습니다.");
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = editing ? "저장 중..." : "등록 중...";

      if(editing){
        editing.no = no; editing.name = name; editing.nurse = nurse; editing.categories = cats; editing.startMonths = startMonths; editing.location = location;
      } else {
        // 환자번호(no)를 그대로 내부 ID로 사용합니다 (번호가 비어있는 예외적인 경우에만 임시 ID 생성).
        var newId = no || uid("p");
        var p = { id: newId, no:no, name:name, nurse:nurse, categories:cats, startMonths:startMonths, location:location, createdAt: todayStr() };
        S.patients.push(p);
        // 정식 등록 전, "환자배정 미등록" 상태로 미리 체크해둔 기록이 있으면 그대로 이어받습니다.
        var virtualId = "virtual_" + no;
        if(no && S.patientStates[virtualId]){
          S.patientStates[newId] = S.patientStates[virtualId];
          delete S.patientStates[virtualId];
        } else if(!S.patientStates[newId]){
          S.patientStates[newId] = { items:{} };
        }
        await saveAllPatientStates();
      }
      await storageSet(K_PATIENTS, S.patients, true);
      closeModal();
      showToast(editing ? "수정되었습니다." : "등록되었습니다.");
      renderAll();
    };
  }

  async function exportAllData(){
    try{
      var data = {
        exportedAt: todayStr(),
        templates: S.templates,
        staff: S.staff,
        patients: S.patients,
        patientStates: {},
        candidates: S.candidates,
        bloodTests: S.bloodTests,
        visits: {}
      };
      S.patients.forEach(function(p){
        data.patientStates[p.id] = S.patientStates[p.id] || { items:{} };
      });

      // 방문목록은 달마다 별도 저장소에 있으므로, 존재하는 모든 달을 찾아서 전부 담습니다.
      try{
        var listResult = await storageList("visits:", true);
        if(listResult && listResult.keys){
          for(var i=0;i<listResult.keys.length;i++){
            var key = listResult.keys[i];
            var v = await storageGet(key, true);
            data.visits[key] = Array.isArray(v) ? v : [];
          }
        }
      }catch(e){ /* 목록 조회 실패해도 나머지 백업은 진행 */ }
      // 혹시 목록 조회가 안 되는 환경이면, 최소한 지금 보고 있는 달만이라도 포함
      var currentVisitKey = visitStateKey(S.visitLogYear, S.visitLogMonth);
      if(!data.visits[currentVisitKey]){ data.visits[currentVisitKey] = S.visits; }

      var blob = new Blob([JSON.stringify(data, null, 2)], { type:"application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "checklist-backup-" + todayStr() + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      showToast("백업 파일을 다운로드했습니다.");
    }catch(e){
      showToast("백업 파일 생성에 실패했습니다.");
    }
  }

  async function importAllData(fileInput){
    var file = fileInput.files && fileInput.files[0];
    if(!file){ showToast("파일을 선택해주세요."); return; }
    var text;
    try{ text = await file.text(); }catch(e){ showToast("파일을 읽을 수 없습니다."); return; }
    var data;
    try{ data = JSON.parse(text); }catch(e){ showToast("올바른 백업 파일이 아닙니다."); return; }
    if(!data || !Array.isArray(data.patients) || !data.templates || !Array.isArray(data.staff)){
      showToast("올바른 백업 파일 형식이 아닙니다.");
      return;
    }

    var ok = await showConfirm("지금 데이터를 이 백업 파일(" + (data.exportedAt||"") + ") 내용으로 완전히 덮어씁니다. 계속할까요?");
    if(!ok) return;

    S.templates = data.templates;
    S.staff = data.staff;
    S.patients = data.patients;
    S.patientStates = data.patientStates || {};
    S.candidates = Array.isArray(data.candidates) ? data.candidates : [];
    S.bloodTests = Array.isArray(data.bloodTests) ? data.bloodTests : [];

    await storageSet(K_TEMPLATES, S.templates, true);
    await storageSet(K_STAFF, S.staff, true);
    await storageSet(K_PATIENTS, S.patients, true);
    await storageSet(K_CANDIDATES, S.candidates, true);
    await storageSet(K_BLOODTESTS, S.bloodTests, true);
    S.patients.forEach(function(p){
      if(!S.patientStates[p.id]){ S.patientStates[p.id] = { items:{} }; }
    });
    await saveAllPatientStates();

    // 방문목록(월별) 복원
    S.visitsCache = {};
    if(data.visits && typeof data.visits === "object"){
      var visitKeys = Object.keys(data.visits);
      for(var j=0;j<visitKeys.length;j++){
        await storageSet(visitKeys[j], data.visits[visitKeys[j]], true);
        S.visitsCache[visitKeys[j].replace(/^visits:/,"")] = data.visits[visitKeys[j]];
      }
    }
    S.visits = await loadVisitsForMonth(S.visitLogYear, S.visitLogMonth);
    S.visitsCache[monthKey(S.visitLogYear, S.visitLogMonth)] = S.visits;

    closeModal();
    showToast("백업 파일로 복원했습니다.");
    renderWhoSelect();
    updateVisitsTabLabel();
    renderAll();
  }
