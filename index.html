<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>연세마주봄의원 등록환자 관리시스템</title>
<style>
  :root{
    --paper:#F4F5F3;
    --paper-raised:#FFFFFF;
    --ink:#1C2B2A;
    --ink-soft:#5B6A67;
    --line:#D8DCDA;
    --line-soft:#E7EAE8;
    --teal:#0F6B5C;
    --teal-soft:#E4F0EC;
    --home:#0033A0;
    --home-text:#0033A0;
    --home-soft:#E4E9F5;
    --visit:#bfe1f6;
    --visit-text:#1C6EA4;
    --disability:#ffcfc9;
    --disability-text:#B23B30;
    --solo:#ffe5a0;
    --solo-text:#7A5900;
    --extra:#fff4c2;
    --extra-text:#8A6D1E;
    --warn:#A23E2A;
    --warn-soft:#F5E7E3;
    --radius:6px;
    --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding-bottom:64px;
  }
  button{ font-family:inherit; }
  .wrap{ max-width:760px; margin:0 auto; padding:0 14px; }

  /* ---------- Top bar ---------- */
  .topbar{
    background:var(--paper-raised);
    border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:30;
  }
  .topbar-inner{
    max-width:760px; margin:0 auto; padding:12px 14px;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .brand{ display:flex; flex-direction:column; margin-right:auto; min-width:0; }
  .brand-name{ font-weight:700; font-size:16px; letter-spacing:-0.01em; }
  .brand-sub{ font-size:12px; color:var(--ink-soft); margin-top:1px; }
  .checklist-nurse-bar{
    display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    margin:10px 0 4px;
  }
  .checklist-nurse-bar .nurse-bar-label{ font-size:12px; color:var(--ink-soft); font-weight:600; margin-right:2px; }
  .btn{
    border:1px solid var(--line); background:var(--paper-raised); color:var(--ink);
    border-radius:var(--radius); padding:7px 12px; font-size:13px; cursor:pointer;
    white-space:nowrap;
  }
  .btn:active{ transform:translateY(1px); }
  .btn-teal{ background:var(--teal); border-color:var(--teal); color:#fff; }
  .btn-admin{ background:var(--ink); border-color:var(--ink); color:#fff; }
  .btn-admin.on{ background:var(--warn); border-color:var(--warn); }
  .btn-ghost{ background:transparent; border-color:transparent; color:var(--ink-soft); text-decoration:underline; padding:6px 4px; }
  .btn-sm{ padding:4px 9px; font-size:12px; }

  /* ---------- Login ---------- */
  .login-screen{
    position:fixed; inset:0; background:var(--paper); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .login-box{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:10px;
    padding:28px 24px; width:100%; max-width:340px;
  }
  .login-box .brand-logo{ display:block; width:100%; max-width:170px; height:auto; margin:0 auto 14px; }
  .login-box .brand-name{ font-size:18px; text-align:center; margin-bottom:2px; }
  .login-box .brand-sub{ font-size:15px; font-weight:700; color:var(--ink-soft); text-align:center; margin-bottom:22px; }
  .login-field{ margin-bottom:14px; }
  .login-field label{ display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:5px; font-weight:600; }
  .login-field select, .login-field input{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:var(--radius);
    font-size:15px; background:var(--paper); color:var(--ink);
  }
  .login-field input{ letter-spacing:4px; font-variant-numeric:tabular-nums; }
  .login-remember{
    display:flex; align-items:center; gap:8px; margin:-2px 0 16px; font-size:13px; color:var(--ink-soft);
  }
  .login-remember input{ width:auto; margin:0; }
  .login-remember label{ cursor:pointer; user-select:none; }
  .login-error{ color:var(--warn); font-size:13px; margin:-4px 0 12px; min-height:0; display:none; }
  .login-error.show{ display:block; }
  .login-submit{
    width:100%; padding:12px; background:var(--teal); border:none; border-radius:var(--radius);
    color:#fff; font-size:15px; font-weight:700; cursor:pointer;
  }
  .login-submit:disabled{ opacity:.6; }
  .login-config-note{ font-size:11.5px; color:var(--ink-soft); text-align:center; margin-top:16px; line-height:1.5; }
  .user-badge{
    font-size:12px; color:var(--ink-soft); white-space:nowrap; padding:6px 4px;
  }
  .user-badge b{ color:var(--ink); }

  /* ---------- Month nav ---------- */
  .monthnav{
    display:flex; align-items:center; justify-content:center; gap:14px;
    padding:12px 0 4px;
  }
  .monthnav .label{ font-weight:700; font-size:16px; min-width:104px; text-align:center; letter-spacing:-0.01em; }
  .monthnav button{
    width:30px; height:30px; border-radius:50%; border:1px solid var(--line); background:var(--paper-raised);
    color:var(--ink); font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }

  /* ---------- Dashboard ---------- */
  .dashboard{
    margin:10px 0 16px; border:1px solid var(--line); border-radius:var(--radius); background:var(--paper-raised);
    overflow:hidden;
  }
  .dashboard-head{
    display:flex; align-items:center; gap:16px; padding:12px 14px; cursor:pointer;
  }
  .dash-stat{ display:flex; flex-direction:column; }
  .dash-stat-clickable{ cursor:pointer; border-radius:8px; padding:2px 6px; margin:-2px -6px; }
  .dash-stat-clickable:hover{ background:var(--paper); }
  .dash-stat-clickable.selected{ background:var(--paper); box-shadow:inset 0 0 0 1px var(--line); }
  .dash-stat .num{ font-weight:700; font-size:20px; font-variant-numeric:tabular-nums; }
  .dash-stat .lbl{ font-size:11px; color:var(--ink-soft); margin-top:1px; }
  .dashboard-head .chev{ margin-left:auto; color:var(--ink-soft); transition:transform .15s; }
  .dashboard-body{ border-top:1px solid var(--line-soft); padding:10px 14px 14px; display:none; }
  .dashboard.open .dashboard-body{ display:block; }
  .dashboard.open .chev{ transform:rotate(180deg); }
  .board-summary{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:4px; }
  .board-metric{
    flex:1 1 100px; min-width:90px; background:var(--paper); border:1px solid var(--line);
    border-radius:8px; padding:8px 10px; text-align:center;
  }
  .board-metric-label{ font-size:11px; color:var(--ink-soft); margin-bottom:3px; }
  .board-metric-value{ font-size:16px; font-weight:700; font-variant-numeric:tabular-nums; }
  .board-patient-row:hover{ background:var(--paper); }
  .miss-item{
    display:flex; align-items:baseline; gap:8px; padding:6px 0; font-size:13px; border-bottom:1px dashed var(--line-soft);
    cursor:pointer;
  }
  .miss-item:last-child{ border-bottom:none; }
  .miss-item .who{ color:var(--ink-soft); }
  .empty-note{ color:var(--ink-soft); font-size:13px; padding:6px 0; }

  /* ---------- Patient list ---------- */
  .toolbar{ display:flex; justify-content:space-between; align-items:center; margin:4px 0 8px; }
  .toolbar h2{ font-size:14px; margin:0; color:var(--ink-soft); font-weight:600; }
  .patient{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius);
    margin-bottom:10px; overflow:hidden;
  }
  .patient-head{
    display:flex; align-items:center; gap:10px; padding:12px 14px; cursor:pointer;
  }
  .patient-head .chev{ color:var(--ink-soft); font-size:12px; transition:transform .15s; flex:none; }
  .patient.open .patient-head .chev{ transform:rotate(90deg); }
  .patient-id{
    font-size:12px; color:var(--ink-soft); font-variant-numeric:tabular-nums; flex:none; width:34px;
  }
  .patient-name{ font-weight:700; font-size:15px; flex:none; }
  .badge{
    font-size:11px; padding:2px 7px; border-radius:20px; font-weight:600; flex:none;
  }
  .badge-재택{ background:var(--home); color:#fff; }
  .badge-일방시{ background:var(--visit); color:var(--visit-text); }
  .badge-장주사{ background:var(--disability); color:var(--disability-text); }
  .badge-단독간호{ background:var(--solo); color:var(--solo-text); }
  .badge-추가간호{ background:var(--extra); color:var(--extra-text); }
  .badge.chip-missing{ box-shadow: inset 0 0 0 1px var(--warn); }
  .badge.chip-pending{ opacity:.55; }
  .badge.chip-needinfo{ border:1px dashed var(--warn); opacity:.85; }
  .badge.chip-unvisited{ opacity:.5; filter:grayscale(40%); }
  .patient-badges{ display:flex; gap:5px; flex-wrap:wrap; }
  .patient-nurse{ font-size:12px; color:var(--ink-soft); margin-left:auto; text-align:right; flex:none; }
  .patient-body{ display:none; border-top:1px solid var(--line-soft); }
  .patient.open .patient-body{ display:block; }

  .category-block{ border-bottom:1px solid var(--line-soft); }
  .category-block:last-child{ border-bottom:none; }
  .category-title{
    display:flex; align-items:center; gap:8px; padding:9px 14px 4px; font-size:12px; font-weight:700;
  }
  .category-bar{ width:3px; height:13px; border-radius:2px; }
  .cat-재택 .category-bar{ background:var(--home); } .cat-재택-text{ color:var(--home); }
  .cat-일방시 .category-bar{ background:var(--visit); } .cat-일방시-text{ color:var(--visit-text); }
  .cat-장주사 .category-bar{ background:var(--disability); } .cat-장주사-text{ color:var(--disability-text); }

  .group-block{ padding:2px 0 8px 15px; }
  .group-title{ font-size:12.5px; color:var(--ink-soft); font-weight:600; padding:5px 14px 2px; }
  .group-title.tag-solo{ display:inline-block; background:var(--solo); color:var(--solo-text); border-radius:4px; padding:3px 9px; margin:3px 14px 4px; }
  .group-title.tag-extra{ display:inline-block; background:var(--extra); color:var(--extra-text); border-radius:4px; padding:3px 9px; margin:3px 14px 4px; }

  .item-row{
    display:flex; align-items:flex-start; gap:9px; padding:6px 14px 6px 22px; position:relative;
  }
  .item-row::before{
    content:""; position:absolute; left:14px; top:0; bottom:0; width:1px; background:var(--line-soft);
  }
  .item-row:last-child::before{ bottom:50%; }

  .chk{
    width:19px; height:19px; margin-top:1px; flex:none; accent-color:var(--teal); cursor:pointer;
  }
  .item-main{ flex:1; min-width:0; }
  .item-label{ font-size:14px; }
  .req-tag{ font-size:10px; font-weight:700; color:var(--warn); background:var(--warn-soft); border-radius:4px; padding:1px 5px; margin-left:6px; vertical-align:middle; }
  .item-meta{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .item-meta button{ border:none; background:none; color:var(--warn); text-decoration:underline; cursor:pointer; font-size:11.5px; padding:0; margin-left:6px; }

  .log-row .item-label{ margin-bottom:2px; }
  .log-date-input{
    border:1px solid var(--line); background:var(--paper); color:var(--ink);
    border-radius:6px; padding:4px 8px; font-size:12.5px;
  }
  .log-add{
    border:1px dashed var(--line); background:var(--paper); color:var(--ink);
    border-radius:20px; padding:4px 12px; font-size:12.5px; cursor:pointer; white-space:nowrap;
  }
  .log-chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:7px; }
  .chip{
    display:flex; align-items:center; gap:5px; background:var(--teal-soft); color:var(--teal);
    border-radius:20px; padding:3px 4px 3px 10px; font-size:12px; font-variant-numeric:tabular-nums;
  }
  .chip button{ border:none; background:none; color:var(--teal); cursor:pointer; font-size:13px; line-height:1; padding:2px 6px; }

  .no-category-note{ padding:12px 14px; font-size:13px; color:var(--ink-soft); }

  /* ---------- 연간 보기 테이블 ---------- */
  .year-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .year-table{ border-collapse:collapse; width:100%; min-width:640px; font-size:12px; }
  .year-table th, .year-table td{ border-bottom:1px solid var(--line-soft); padding:5px 4px; text-align:center; white-space:nowrap; }
  .year-table th{ color:var(--ink-soft); font-weight:600; font-size:11px; padding-top:6px; }
  .year-table td.ycell{ cursor:pointer; min-width:34px; }
  .year-table td.ycell:hover{ background:var(--paper); }
  .year-table td.yname{ text-align:left; position:sticky; left:0; background:var(--paper-raised); padding-left:14px; max-width:220px; overflow:hidden; text-overflow:ellipsis; }
  .year-table tr.ycat-row td.yname{ font-weight:700; padding-top:10px; }
  .year-table tr.ygroup-row td.yname{ font-weight:600; color:var(--ink-soft); padding-left:20px; }
  .year-check{ color:var(--teal); font-weight:700; }
  .year-dates{ color:var(--ink-soft); font-size:10.5px; }
  .year-req-dot{ display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--warn); margin-right:4px; vertical-align:middle; }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(28,43,42,0.45); display:none;
    align-items:flex-end; justify-content:center; z-index:50;
  }
  .overlay.show{ display:flex; }
  .modal{
    background:var(--paper-raised); width:100%; max-width:520px; border-radius:14px 14px 0 0;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto;
  }
  @media (min-width:560px){
    .overlay{ align-items:center; }
    .modal{ border-radius:14px; }
  }
  .modal h3{ margin:0 0 14px; font-size:17px; }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:4px; font-weight:600; }
  .field input[type=text], .field input[type=number], .field input[type=password], .field select{
    width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:var(--radius); font-size:14px;
    background:var(--paper); color:var(--ink);
  }
  .check-group{ display:flex; gap:14px; flex-wrap:wrap; }
  .check-group label{ display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink); font-weight:400; }
  .cat-config-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px solid var(--line-soft); }
  .cat-config-row:last-child{ border-bottom:none; }
  .cat-config-row label{ display:flex; align-items:center; gap:7px; font-size:13.5px; font-weight:500; }
  .cat-config-row input[type=month]{ width:150px; padding:6px 8px; border:1px solid var(--line); border-radius:var(--radius); font-size:13px; background:var(--paper); color:var(--ink); }
  .cat-config-row input[type=month]:disabled{ opacity:.4; background:var(--paper); }
  .modal-actions{ display:flex; gap:8px; margin-top:16px; }
  .modal-actions .btn{ flex:1; text-align:center; }
  .small-link{ font-size:12px; color:var(--teal); text-decoration:underline; cursor:pointer; background:none; border:none; padding:0; margin-top:4px; }

  /* admin panel */
  .admin-group{ border:1px solid var(--line); border-radius:var(--radius); padding:10px; margin-bottom:10px; }
  .admin-group-head{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .admin-group-head input{ flex:1; font-weight:600; font-size:13px; padding:5px 7px; border:1px solid var(--line-soft); border-radius:4px; }
  .admin-item-row{ display:flex; align-items:center; gap:6px; padding:5px 0; flex-wrap:wrap; }
  .admin-item-row input{ flex:1; font-size:13px; padding:5px 7px; border:1px solid var(--line-soft); border-radius:4px; }
  .admin-item-row select{ font-size:12px; padding:4px; border:1px solid var(--line-soft); border-radius:4px; }
  .icon-btn{ border:none; background:none; color:var(--warn); cursor:pointer; font-size:16px; line-height:1; padding:2px 6px; }
  .add-line{ border:1px dashed var(--line); background:transparent; border-radius:4px; padding:5px 10px; font-size:12.5px; color:var(--ink-soft); cursor:pointer; margin-top:4px; }
  .cat-tabs{ display:flex; gap:6px; margin-bottom:12px; }
  .cat-tab{ flex:1; text-align:center; padding:7px; border-radius:var(--radius); border:1px solid var(--line); background:var(--paper); font-size:13px; cursor:pointer; font-weight:600; }
  .cat-tab.active{ background:var(--ink); color:#fff; border-color:var(--ink); }

  .toast{
    position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:9px 16px; border-radius:20px; font-size:13px;
    z-index:80; opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .toast.show{ opacity:1; }

  .empty-state{ text-align:center; padding:40px 20px; color:var(--ink-soft); }

  /* ---------- 체크리스트 상단/하단 구획 ---------- */
  .checklist-section-header{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    font-size:13px; font-weight:700; color:var(--ink-soft);
    padding:9px 10px; margin-top:10px; border-radius:6px;
  }
  .checklist-section-header.section-visited{ background:var(--teal-soft); color:var(--teal); }
  .checklist-section-header.section-novisit{ background:var(--line-soft); color:var(--ink-soft); }
  .checklist-subsection-header{
    font-size:12px; font-weight:700; padding:5px 10px; margin:8px 0 2px;
    border-left:3px solid; border-radius:0 4px 4px 0;
  }
  .checklist-subsection-header.sub-assigned{ border-color:var(--home); color:var(--home); background:var(--home-soft); }
  .checklist-subsection-header.sub-unassigned{ border-color:var(--visit-text); color:var(--visit-text); background:var(--paper); }
  .checklist-two-col{ display:flex; gap:14px; align-items:flex-start; }
  .checklist-col{ flex:1 1 0; min-width:0; border-radius:8px; padding:6px 8px 10px; }
  .checklist-col.col-assigned{ background:var(--home-soft); }
  .checklist-col.col-unassigned{ background:var(--visit); }
  .checklist-col .checklist-subsection-header{ margin-top:2px; }
  @media (max-width:680px){
    .checklist-two-col{ flex-direction:column; }
  }
  .virtual-patient{ border-style:dashed; }
  .checklist-section-divider{
    height:1px; background:var(--line); margin:18px 0 10px;
    position:relative;
  }
  .checklist-section-divider::after{
    content:"↓ 아직 이번달 방문 없음"; position:absolute; top:-9px; left:50%; transform:translateX(-50%);
    background:var(--paper); color:var(--ink-soft); font-size:11px; padding:0 10px;
  }
  .proxy-note{ font-weight:600; color:var(--warn); font-size:10.5px; background:var(--warn-soft); padding:1px 7px; border-radius:10px; }
  .mint-by{ font-size:10px; color:var(--ink-soft); cursor:pointer; text-decoration:underline dotted; margin-left:2px; white-space:nowrap; }

  /* ---------- 상단 탭 ---------- */
  .apptabs{ display:flex; gap:8px; max-width:760px; margin:0 auto; padding:12px 14px 0; }
  .apptab{ padding:8px 16px; border:1px solid var(--line); background:var(--paper-raised); border-radius:20px; font-size:13px; font-weight:600; color:var(--ink-soft); cursor:pointer; }
  .apptab.active{ background:var(--ink); color:#fff; border-color:var(--ink); }

  /* ---------- 표 열 필터 행 (엑셀 자동필터 스타일) ---------- */
  .filter-row td{ background:var(--paper); padding:5px 5px; border-bottom:2px solid var(--line); }
  .tf-input{
    width:100%; border:1px solid var(--line); border-radius:5px; padding:4px 6px;
    font-size:11.5px; background:var(--paper-raised); color:var(--ink); min-width:60px;
  }
  .tf-input:focus{ border-color:var(--teal); outline:none; }

  /* ---------- 환자배정 관리 테이블 ---------- */
  .assign-table-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius); }
  .assign-table{ width:100%; border-collapse:collapse; font-size:13px; min-width:620px; }
  .assign-table th, .assign-table td{ padding:9px 10px; border-bottom:1px solid var(--line-soft); text-align:left; white-space:nowrap; }
  .assign-table th{ color:var(--ink-soft); font-weight:600; font-size:11.5px; background:var(--paper); }
  .assign-table tbody tr:hover{ background:var(--paper); }

  /* ---------- 대상자 목록 필터/정렬 바 ---------- */
  .cand-toolbar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:4px 0 10px; }
  .cand-filter-group{ display:flex; gap:6px; }
  .cand-filter-btn{ padding:6px 12px; border:1px solid var(--line); background:var(--paper-raised); border-radius:20px; font-size:12.5px; cursor:pointer; color:var(--ink-soft); font-weight:600; }
  .cand-filter-btn.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .cand-sort-select{ margin-left:auto; padding:6px 10px; border:1px solid var(--line); border-radius:var(--radius); font-size:12.5px; background:var(--paper-raised); color:var(--ink); }
  .badge-보류{ background:#EFEAE2; color:#8A7B5C; }
  .badge-미지정{ background:var(--line-soft); color:var(--ink-soft); }
  .freq-tag{ font-size:11.5px; padding:2px 8px; border-radius:20px; font-weight:600; background:var(--paper); color:var(--ink-soft); border:1px solid var(--line); }
  .freq-tag.active{ background:var(--teal-soft); color:var(--teal); border-color:transparent; }

  /* ---------- 방문목록 ---------- */
  .visit-table td.memo-cell{ white-space:normal; max-width:90px; font-size:12px; padding:4px 4px; }
  .inline-edit{
    width:100%; min-width:70px; max-width:90px; border:1px solid transparent; background:transparent;
    color:var(--ink); font-size:12px; padding:5px 6px; border-radius:4px; font-family:inherit;
    white-space:normal; word-break:break-word; resize:vertical; overflow:hidden;
  }
  .inline-edit:hover{ border-color:var(--line); background:var(--paper-raised); }
  .inline-edit:focus{ border-color:var(--teal); background:var(--paper-raised); outline:none; }
  .visit-check-yes{ color:var(--teal); font-weight:700; }
  .visit-check-no{ color:var(--line); }
  .nurse-badge{ display:inline-block; padding:2px 9px; border-radius:20px; font-size:11.5px; font-weight:600; white-space:nowrap; }
</style>

<script>
(function(){
  "use strict";

  /* ================= 기본 데이터 ================= */
  var CATS = ["재택","일방시","장주사"];

  // req: { first: 첫 방문달에 필수인지, after: 첫 방문달 이후(2회차~)에 필수인지 }
  // req가 없거나 first/after 모두 false면 "선택(인센티브)" 항목으로 취급합니다.
  var DEFAULT_TEMPLATES = {
    "재택": [
      { group:"동의서", items:[
        { name:"재택동의서", type:"check", req:{first:true, after:true}, once:true },
        { name:"일방시동의서", type:"check", req:{first:true, after:true}, once:true }
      ]},
      { group:"재택서식", items:[
        { name:"MINT 포괄평가 및 케어플랜", type:"check", req:{first:true, after:false} },
        { name:"MINT 의사기록지", type:"check", req:{first:false, after:true} },
        { name:"MINT 간호사기록지", type:"check", req:{first:false, after:true} },
        { name:"요양정보마당 포괄평가 및 케어플랜", type:"check", req:{first:true, after:false} },
        { name:"요양정보마당 의사기록지", type:"check", req:{first:false, after:true} },
        { name:"요양정보마당 간호사기록지", type:"check", req:{first:false, after:true} }
      ]},
      { group:"단독간호", items:[
        { name:"방문", type:"check", req:{first:true, after:true} },
        { name:"EMR 단독간호 챠팅", type:"check", req:{first:true, after:true} },
        { name:"MINT 단독간호 기록지", type:"check", req:{first:true, after:true} },
        { name:"요양정보마당 단독간호기록지", type:"check", req:{first:true, after:true} }
      ]},
      { group:"추가간호", items:[
        { name:"방문 날짜", type:"log", req:{first:false, after:false} }
      ]},
      { group:"MINT 일방시", items:[
        { name:"MINT 일방시 점검서식", type:"check", req:{first:true, after:true}, syncFromVisit:true }
      ]}
    ],
    "일방시": [
      { group:"동의서", items:[
        { name:"일방시동의서", type:"check", req:{first:true, after:true}, once:true }
      ]},
      { group:"방문", items:[
        { name:"방문 날짜", type:"log", req:{first:true, after:true} }
      ]},
      { group:"MINT 일방시", items:[
        { name:"MINT 일방시 점검서식", type:"check", req:{first:true, after:true}, syncFromVisit:true }
      ]}
    ],
    "장주사": [
      { group:"동의서", items:[
        { name:"장주사동의서", type:"check", req:{first:true, after:true}, once:true }
      ]},
      { group:"장주서식", items:[
        { name:"MINT 장주사 포괄평가", type:"check", req:{first:true, after:false} },
        { name:"MINT 장주사 종합계획", type:"check", req:{first:true, after:false} },
        { name:"HIRA 장주사 포괄/종합계획", type:"check", req:{first:true, after:false} },
        { name:"MINT 장주사 방문점검 서식", type:"check", req:{first:false, after:true} },
        { name:"HIRA 장주사 의사/간호사 방문", type:"check", req:{first:true, after:true} },
        { name:"HIRA 장주사 전화상담", type:"check", req:{first:false, after:false} }
      ]}
    ]
  };

  var DEFAULT_STAFF = ["김혜경", "전송이", "안혜리", "신현경", "전용우"];
  var ADMIN_PIN = "7575";
  var DOCTOR_NAME = "전용우"; // 명단에 자동으로 포함되는 기본 스태프 이름 (특별한 권한 부여는 없음, 관리자 모드는 PIN으로만 구분)

  /* ================= 구글시트 연동 설정 ================= */
  // Apps Script 배포 후 나오는 "웹 앱 URL"을 아래 따옴표 안에 붙여넣으세요.
  // 예: "https://script.google.com/macros/s/AKfycb.../exec"
  var SHEETS_API_URL = "https://script.google.com/macros/s/AKfycbxym6_hTc9P2olvGqg_uSKkq2t7nboh5BD2t8SdeIVG8YtfOS0hF4WZ6H-aBJ1GdDQH4A/exec";
  var SESSION_KEY = "yonsei-checklist-session";
  var SESSION = null; // { token, name, role }

  function loadSession(){
    try{
      var raw = localStorage.getItem(SESSION_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function saveSession(sess, remember){
    SESSION = sess;
    try{
      if(sess && remember) localStorage.setItem(SESSION_KEY, JSON.stringify(sess));
      else localStorage.removeItem(SESSION_KEY);
    }catch(e){}
  }

  async function apiCall(action, params){
    var body = Object.assign({ action: action, token: SESSION ? SESSION.token : "" }, params || {});
    var res = await fetch(SHEETS_API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // Apps Script CORS 프리플라이트 회피용
      body: JSON.stringify(body)
    });
    return await res.json();
  }

  var K_TEMPLATES = "templates";
  var K_STAFF = "staff-list";
  var K_PATIENTS = "patients";
  var K_LAST_NAME = "last-selected-name";
  var K_CANDIDATES = "candidates";
  var K_BLOODTESTS = "blood-tests";
  var K_ALL_STATES = "patient-states-all"; // 환자별 state:ID 키를 다 합쳐서 이 키 하나로 저장 (호출 횟수 절감)
  var K_MINT_CHECKERS = "mint-checkers"; // 간호사 명단과는 별개로, MINT 일방시를 체크하는 사회복지사 등의 명단
  var DEFAULT_MINT_CHECKERS = ["신현경"];
  function stateKey(pid){ return "state:" + pid; }
  async function saveAllPatientStates(){
    return await storageSet(K_ALL_STATES, S.patientStates, true);
  }

  /* ================= 상태 ================= */
  var S = {
    templates: null,
    staff: null,
    mintCheckers: null,
    patients: null,
    patientStates: {},   // id -> state object
    who: "",
    adminMode: false,
    year: new Date().getFullYear(),
    month: new Date().getMonth() + 1,
    openPatients: {},
    dashboardOpen: false,
    viewMode: "month", // "month" | "year"
    appView: "checklist", // "checklist" | "assignment" | "candidates"
    candidates: [],
    candidateFilter: "all", // "all" | "fixed"
    candidateSort: "name", // "no" | "name" | "type" | "freq" | "registeredDate" | "nurse"
    visitLogYear: null,
    visitLogMonth: null,
    visits: [],
    visitsCache: {}, // { "YYYY-MM": [visit,...] } - 체크리스트 탭에서 이번달 방문여부 판정용 캐시
    bloodTests: [],
    checklistTopSearch: "",
    visitStatsOpen: false,
    mintStatsOpen: false,
    dashboardCategory: null, // 재택/일방시/장주사 상황판 중 어떤 게 펼쳐져 있는지
    // 탭별·열별 필터 상태 (엑셀 자동필터처럼 각 표마다 독립적으로 유지됨)
    tableFilters: {
      candidates: {},
      assignment: {},
      visits: {},
      bloodtest: {}
    }
  };

  function monthKey(y,m){ return y + "-" + String(m).padStart(2,"0"); }
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function fmtMD(dateStr){
    var p = dateStr.split("-");
    return p[1] + "/" + p[2];
  }
  function fmtFull(dateStr){
    var p = dateStr.split("-");
    return p[0] + "." + p[1] + "." + p[2];
  }
  var WEEKDAY_KR = ["일","월","화","수","목","금","토"];
  function fmtMDWeekday(dateStr){
    var p = dateStr.split("-");
    var d = new Date(dateStr + "T00:00:00");
    var wd = isNaN(d.getTime()) ? "" : WEEKDAY_KR[d.getDay()];
    return p[1] + p[2] + (wd ? "("+wd+")" : "");
  }
  function uid(prefix){ return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  // 등록월(시작월)이 아직 없는 환자는 "오늘 기준 현재월"부터 리스트에 노출됩니다.
  var UNSET_VISIBLE_FROM = (function(){
    var d = new Date();
    return monthKey(d.getFullYear(), d.getMonth()+1);
  })();

  /* ================= 저장소 =================
     공유 데이터(shared=true)는 구글시트(전 직원 공유)에,
     개인 기기 설정(shared=false, 예: 마지막으로 선택한 담당자)은
     이 기기의 localStorage에만 저장합니다. */
  async function storageGet(key, shared){
    if(!shared){
      try{
        var raw = localStorage.getItem("local:" + key);
        return raw ? JSON.parse(raw) : null;
      }catch(e){ return null; }
    }
    try{
      var r = await apiCall("kv_get", { key: key });
      if(!r || !r.ok) { handleApiError(r); return null; }
      if(r.value === null || typeof r.value === "undefined") return null;
      return JSON.parse(r.value);
    }catch(e){ return null; }
  }
  async function storageSet(key, value, shared){
    if(!shared){
      try{
        localStorage.setItem("local:" + key, JSON.stringify(value));
        return true;
      }catch(e){ return false; }
    }
    try{
      var r = await apiCall("kv_set", { key: key, value: JSON.stringify(value) });
      if(!r || !r.ok){
        handleApiError(r);
        showToast("저장에 실패했습니다. 다시 시도해주세요.");
        return false;
      }
      return true;
    }catch(e){
      showToast("저장에 실패했습니다. 인터넷 연결을 확인해주세요.");
      return false;
    }
  }
  async function storageDelete(key, shared){
    if(!shared){
      try{ localStorage.removeItem("local:" + key); }catch(e){}
      return true;
    }
    try{
      var r = await apiCall("kv_delete", { key: key });
      if(!r || !r.ok) handleApiError(r);
      return true;
    }catch(e){ return false; }
  }
  async function storageList(prefix, shared){
    try{
      var r = await apiCall("kv_list", { prefix: prefix || "" });
      if(!r || !r.ok){ handleApiError(r); return null; }
      return r; // { ok:true, keys:[...] }
    }catch(e){ return null; }
  }
  // 서로 무관한 여러 shared 키를 한 번의 API 호출로 모아서 읽어옵니다.
  // (Apps Script는 요청 하나마다 스프레드시트를 여는 비용이 있어서,
  //  Promise.all로 여러 개를 "동시에" 보내는 것보다 이렇게 "한 번에 묶어서" 보내는 편이
  //  더 빠르고, Apps Script의 동시 실행 제한 문제에서도 자유롭습니다.)
  async function storageGetMany(keys){
    var out = {};
    keys.forEach(function(k){ out[k] = null; });
    try{
      var r = await apiCall("kv_get_many", { keys: keys });
      if(!r || !r.ok){ handleApiError(r); return out; }
      keys.forEach(function(k){
        var v = r.values ? r.values[k] : null;
        out[k] = (v === null || typeof v === "undefined") ? null : JSON.parse(v);
      });
      return out;
    }catch(e){ return out; }
  }
  // 이번 로드에서 실제로 바뀐 shared 키들을 한 번의 API 호출로 모아서 저장합니다.
  async function storageSetMany(pairs){
    // pairs: [{key, value}, ...] (value는 원본 JS 값, 여기서 JSON.stringify 처리)
    if(!pairs.length) return true;
    try{
      var items = pairs.map(function(p){ return { key: p.key, value: JSON.stringify(p.value) }; });
      var r = await apiCall("kv_set_many", { items: items });
      if(!r || !r.ok){
        handleApiError(r);
        showToast("저장에 실패했습니다. 다시 시도해주세요.");
        return false;
      }
      return true;
    }catch(e){
      showToast("저장에 실패했습니다. 인터넷 연결을 확인해주세요.");
      return false;
    }
  }
  // 로그인 세션이 만료/무효화된 경우 로그인 화면으로 되돌립니다.
  function handleApiError(r){
    if(r && r.error === "auth"){
      saveSession(null);
      showToast("로그인이 만료되었습니다. 다시 로그인해주세요.");
      setTimeout(function(){ location.reload(); }, 1200);
    }
  }

  function showToast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(showToast._h);
    showToast._h = setTimeout(function(){ t.classList.remove("show"); }, 2200);
  }

  /* ================= 초기 로드 ================= */
  // 예전 버전에서 저장된 templates에는 req(필수여부)/once(1회성) 필드가 없을 수 있습니다.
  // 항목명이 기본 템플릿과 일치하면 그 기준값으로, 아니면(관리자가 새로 만든 항목) 선택 항목으로 채워넣습니다.
  function migrateTemplates(tpl){
    var changed = false;
    CATS.forEach(function(cat){
      var defGroups = DEFAULT_TEMPLATES[cat] || [];
      var defLookup = {};
      defGroups.forEach(function(g){
        g.items.forEach(function(it){ defLookup[it.name] = it; });
      });
      if(!tpl[cat]) tpl[cat] = [];
      tpl[cat].forEach(function(g){
        g.items.forEach(function(it){
          if(!it.req || typeof it.req.first === "undefined" || typeof it.req.after === "undefined"){
            var d = defLookup[it.name];
            it.req = d ? { first: !!d.req.first, after: !!d.req.after } : { first:false, after:false };
            changed = true;
          }
          if(typeof it.once === "undefined"){
            var d2 = defLookup[it.name];
            it.once = d2 ? !!d2.once : false;
            changed = true;
          }
          if(typeof it.syncFromVisit === "undefined"){
            var d3 = defLookup[it.name];
            if(d3 && d3.syncFromVisit){ it.syncFromVisit = true; changed = true; }
          }
        });
      });
      // 이후 버전에서 새로 추가된 중분류(예: "MINT 일방시")가 저장된 데이터에 없으면 그대로 추가해줍니다.
      defGroups.forEach(function(dg){
        var exists = tpl[cat].some(function(g){ return g.group === dg.group; });
        if(!exists){
          tpl[cat].push(JSON.parse(JSON.stringify(dg)));
          changed = true;
        }
      });
    });
    return changed;
  }

  var K_MIGRATION_CONSENT_AFTER = "migration-consent-after-required";
  // 동의서류는 "받을 때까지" 계속 필수로 표시되어야 하므로, 이미 저장된 예전 데이터에도 1회만 강제로 맞춰줍니다.
  // (관리자가 이후에 직접 끄면 그 설정을 존중하고, 이 마이그레이션은 다시 실행되지 않습니다.)
  var CONSENT_ITEM_NAMES = ["재택동의서", "일방시동의서", "장주사동의서"];
  function forceConsentAfterRequired(tpl){
    var changed = false;
    CATS.forEach(function(cat){
      (tpl[cat] || []).forEach(function(g){
        g.items.forEach(function(it){
          if(CONSENT_ITEM_NAMES.indexOf(it.name) !== -1 && it.req && it.req.first && !it.req.after){
            it.req.after = true;
            changed = true;
          }
        });
      });
    });
    return changed;
  }

  var K_MIGRATIONS_DONE = "migrations-done-v1"; // 예전 개별 마이그레이션 플래그 5개를 이 플래그 1개로 통합

  async function init(){
    S.visitLogYear = new Date().getFullYear();
    S.visitLogMonth = new Date().getMonth() + 1;
    var currentVisitKey = visitStateKey(S.visitLogYear, S.visitLogMonth);

    // 서로 무관한 조회들을 한 번의 API 호출로 묶어서 요청합니다(kv_get_many).
    // 예전에는 이 8개를 하나씩 순서대로 기다렸는데(초기 로딩이 느렸던 핵심 원인),
    // Promise.all로 "동시에" 여러 번 보내는 방법도 가능하지만, 구글시트/Apps Script는
    // 요청 하나마다 스프레드시트를 여는 비용이 있고 동시 실행 제한도 있어서,
    // 이렇게 한 번의 호출(kv_get_many)로 묶는 편이 더 빠르고 안전합니다.
    // (K_LAST_NAME은 기기 로컬 설정이라 네트워크 호출 없이 즉시 가져옵니다.)
    var sharedKeys = [K_TEMPLATES, K_STAFF, K_PATIENTS, K_ALL_STATES, K_CANDIDATES, K_BLOODTESTS, currentVisitKey, K_MIGRATIONS_DONE, K_MINT_CHECKERS];
    var sharedResults = await storageGetMany(sharedKeys);
    var lastName = await storageGet(K_LAST_NAME, false);

    S.templates = sharedResults[K_TEMPLATES];
    S.staff = sharedResults[K_STAFF];
    S.patients = sharedResults[K_PATIENTS];
    var allStates = sharedResults[K_ALL_STATES];
    S.candidates = sharedResults[K_CANDIDATES];
    S.bloodTests = sharedResults[K_BLOODTESTS];
    var visitsRaw = sharedResults[currentVisitKey];
    var migrationsDone = sharedResults[K_MIGRATIONS_DONE];
    S.mintCheckers = sharedResults[K_MINT_CHECKERS];

    // ---- 아래는 전부 메모리 안에서만 처리(네트워크 호출 없음) ----
    var staffChanged = false, patientsChanged = false, candidatesChanged = false, bloodTestsChanged = false, templatesChanged = false, mintCheckersChanged = false;

    if(!S.templates){ S.templates = DEFAULT_TEMPLATES; templatesChanged = true; }
    else if(migrateTemplates(S.templates)){ templatesChanged = true; }

    if(!S.staff){ S.staff = DEFAULT_STAFF.slice(); staffChanged = true; }
    if(S.staff.indexOf(DOCTOR_NAME) === -1){ S.staff.push(DOCTOR_NAME); staffChanged = true; }

    if(!Array.isArray(S.mintCheckers)){ S.mintCheckers = DEFAULT_MINT_CHECKERS.slice(); mintCheckersChanged = true; }
    // 간호사 명단에 사회복지사 등 비간호사가 잘못 섞여있으면(예: 이전에 실수로 추가된 경우) MINT 체크자 명단으로 옮겨줍니다.
    DEFAULT_MINT_CHECKERS.forEach(function(name){
      var idx = S.staff.indexOf(name);
      if(idx !== -1){ S.staff.splice(idx, 1); staffChanged = true; }
      if(S.mintCheckers.indexOf(name) === -1){ S.mintCheckers.push(name); mintCheckersChanged = true; }
    });

    if(!S.patients || !Array.isArray(S.patients)){ S.patients = []; patientsChanged = true; }
    var beforeLen = S.patients.length;
    S.patients = S.patients.filter(function(p){ return p && typeof p === "object" && p.id; });
    if(S.patients.length !== beforeLen) patientsChanged = true;
    S.patients.forEach(function(p){
      if(!Array.isArray(p.categories)){ p.categories = []; patientsChanged = true; }
      if(!p.startMonths || typeof p.startMonths !== "object"){ p.startMonths = {}; patientsChanged = true; }
      if(typeof p.name !== "string"){ p.name = p.name ? String(p.name) : ""; patientsChanged = true; }
    });

    // 실제 로그인(PIN 인증)된 이름을 기본값으로 사용합니다. (예전의 "마지막 선택 이름 자동적용" 방식은 더 이상 신원 판단에 쓰지 않음)
    S.who = (SESSION && SESSION.name) ? SESSION.name : ((lastName && (lastName === "전체" || S.staff.indexOf(lastName) !== -1)) ? lastName : "전체");

    // 환자별 상태: 통합 키가 있으면 그대로 사용. 없는(이관 전) 경우에만 예전 방식으로 1회 개별 조회.
    if(allStates && typeof allStates === "object"){
      S.patientStates = allStates;
    } else {
      S.patientStates = {};
      for(var i=0;i<S.patients.length;i++){
        var st = await storageGet(stateKey(S.patients[i].id), true);
        S.patientStates[S.patients[i].id] = (st && typeof st === "object" && st.items) ? st : { items:{} };
      }
      await saveAllPatientStates();
    }
    S.patients.forEach(function(p){
      var st = S.patientStates[p.id];
      if(!st || typeof st !== "object" || !st.items || typeof st.items !== "object"){
        S.patientStates[p.id] = { items:{} };
      }
    });

    if(!Array.isArray(S.candidates)){ S.candidates = []; candidatesChanged = true; }
    if(normalizeAndMergeCandidates()){ candidatesChanged = true; }

    if(!Array.isArray(S.bloodTests)){ S.bloodTests = []; bloodTestsChanged = true; }

    S.visits = Array.isArray(visitsRaw) ? visitsRaw : [];
    S.visitsCache[monthKey(S.visitLogYear, S.visitLogMonth)] = S.visits;
    updateVisitsTabLabel();

    // 기존에 임의 생성된 내부ID를 쓰던 환자들을, 환자번호를 내부ID로 쓰도록 1회 정리합니다.
    // (환자번호가 곧 내부ID가 되면, "환자배정 미등록" 상태에서 미리 체크해둔 기록이
    //  정식 등록 후에도 번호만 같으면 자동으로 이어집니다.)
    await migratePatientIdsToNo();

    // 1회성 마이그레이션들 (동의서 필수화, 김혜경 임포트, 대상자 백필, 전체명단 임포트, 등록날짜 갱신)
    // 예전에는 이 5개의 완료여부를 매번 각각 확인했지만, 이제 통합 플래그 1개로 한 번만 확인합니다.
    // (이미 다 완료된 상태라면 이 블록 전체가 통째로 건너뛰어집니다.)
    if(!migrationsDone){
      if(forceConsentAfterRequired(S.templates)){ templatesChanged = true; }
      await runKimHyekyungImport();
      await backfillCandidatesFromPatients();
      await importFullCandidateRoster();
      await applyRegDateUpdateList();
      await storageSet(K_MIGRATIONS_DONE, true, true);
    }

    // 이번 로드에서 실제로 바뀐 것만 모아서 한 번에(병렬) 저장합니다.
    // 이번 로드에서 실제로 바뀐 것만 모아서 한 번의 API 호출(kv_set_many)로 저장합니다.
    var writePairs = [];
    if(templatesChanged) writePairs.push({ key: K_TEMPLATES, value: S.templates });
    if(staffChanged) writePairs.push({ key: K_STAFF, value: S.staff });
    if(patientsChanged) writePairs.push({ key: K_PATIENTS, value: S.patients });
    if(candidatesChanged) writePairs.push({ key: K_CANDIDATES, value: S.candidates });
    if(bloodTestsChanged) writePairs.push({ key: K_BLOODTESTS, value: S.bloodTests });
    if(mintCheckersChanged) writePairs.push({ key: K_MINT_CHECKERS, value: S.mintCheckers });
    if(writePairs.length){ await storageSetMany(writePairs); }

    renderWhoSelect();
    renderMonthLabel();
    renderAll();
  }

  function visitStateKey(y, m){ return "visits:" + monthKey(y, m); }
  async function loadVisitsForMonth(y, m){
    var list = await storageGet(visitStateKey(y, m), true);
    return Array.isArray(list) ? list : [];
  }
  async function saveVisitsForMonth(y, m, list){
    await storageSet(visitStateKey(y, m), list, true);
  }
  function updateVisitsTabLabel(){
    var btn = document.getElementById("tabVisits");
    if(btn) btn.textContent = S.visitLogMonth + "월 방문목록";
  }

  // 예전 버전(type 문자열 1개, 환자당 여러 행)으로 저장된 대상자 데이터를
  // "환자당 1행 + types 배열" 구조로 통일하고, 같은 환자(linkedPatientId 또는 번호+이름 기준) 행을 하나로 합칩니다.
  function normalizeAndMergeCandidates(){
    var changed = false;

    S.candidates.forEach(function(c){
      if(!Array.isArray(c.types)){
        c.types = c.type ? [c.type] : [];
        delete c.type;
        changed = true;
      }
    });

    var groups = {};
    var order = [];
    S.candidates.forEach(function(c){
      var key = c.linkedPatientId ? ("pid:"+c.linkedPatientId) : ("na:"+(c.no||"")+"|"+c.name);
      if(!groups[key]){ groups[key] = []; order.push(key); }
      groups[key].push(c);
    });

    var merged = [];
    order.forEach(function(key){
      var arr = groups[key];
      if(arr.length === 1){ merged.push(arr[0]); return; }
      changed = true;
      var base = arr[0];
      var allTypes = [];
      arr.forEach(function(c){ (c.types||[]).forEach(function(t){ if(t !== "-" && allTypes.indexOf(t) === -1) allTypes.push(t); }); });
      base.types = allTypes;
      merged.push(base);
    });

    S.candidates = merged;
    return changed;
  }

  // 이미 환자배정에 등록되어 있던 환자들을 대상자 목록에도 보이도록 1회성으로 채워 넣습니다.
  // 환자 1명당 1행으로 만들고, 구분이 여러 개면 types 배열에 함께 담습니다.
  // 정확한 방문주기 정보가 없으므로 일단 "미정(확인필요)"으로 넣고, 이미 연동된(linkedPatientId) 건은 건너뜁니다.
  // 예전에는 환자마다 임의의 내부ID(uid)를 따로 부여했지만, 그러면 "환자배정 미등록" 상태에서
  // 미리 체크해둔 기록을 정식 등록 시 이어받으려면 매번 별도 이관 작업이 필요해서 비효율적이었습니다.
  // 환자번호(no)를 그대로 내부ID로 쓰도록 통일하면 번호만 같으면 자동으로 이어지므로, 기존 환자들의
  // 내부ID를 환자번호로 한 번만 정리합니다. (번호가 없거나, 이미 다른 환자가 그 번호를 ID로 쓰고 있으면 건드리지 않음)
  async function migratePatientIdsToNo(){
    var flagKey = "migration-patient-id-to-no";
    var already = await storageGet(flagKey, true);
    if(already) return;

    var changed = false;
    S.patients.forEach(function(p){
      if(!p.no || p.id === p.no) return;
      var conflict = S.patients.some(function(x){ return x !== p && x.id === p.no; });
      if(conflict) return;

      var oldId = p.id;
      var newId = p.no;

      if(S.patientStates[oldId]){
        S.patientStates[newId] = S.patientStates[oldId];
        delete S.patientStates[oldId];
      }
      S.candidates.forEach(function(c){
        if(c.linkedPatientId === oldId){ c.linkedPatientId = newId; }
      });
      p.id = newId;
      changed = true;
    });

    if(changed){
      await storageSet(K_PATIENTS, S.patients, true);
      await storageSet(K_CANDIDATES, S.candidates, true);
      await saveAllPatientStates();
    }
    await storageSet(flagKey, true, true);
  }

  async function backfillCandidatesFromPatients(){
    var flagKey = "migration-backfill-candidates-from-patients";
    var already = await storageGet(flagKey, true);
    if(already) return;

    var linkedIds = {};
    S.candidates.forEach(function(c){ if(c.linkedPatientId){ linkedIds[c.linkedPatientId] = true; } });

    var changed = false;
    S.patients.forEach(function(p){
      if(linkedIds[p.id]) return;
      var types = (p.categories && p.categories.length) ? p.categories.slice() : [];
      S.candidates.push({
        id: uid("c"), no: p.no || "", name: p.name, types: types,
        freq: "미정(확인필요)", nurse: p.nurse || "", linkedPatientId: p.id,
        createdAt: todayStr()
      });
      changed = true;
    });

    if(changed){ await storageSet(K_CANDIDATES, S.candidates, true); }
    await storageSet(flagKey, true, true);
  }

    var patientsChanged = false;

    REGDATE_UPDATE_LIST.forEach(function(row){
      var no = String(row[0]), name = row[1], type = row[2], freq = row[3], iso = ymdToIso(row[4]);

      var cand = S.candidates.find(function(c){ return String(c.no) === no; });
      if(!cand){
        cand = { id: uid("c"), no:no, name:name, types:[], freq:"해당없음", nurse:"", createdAt: todayStr() };
        S.candidates.push(cand);
      }
      cand.types = [type];
      cand.freq = freq;
      cand.registeredDate = iso;
      if(!cand.name){ cand.name = name; }
      candidatesChanged = true;

      if(cand.linkedPatientId){
        var patient = S.patients.find(function(p){ return p.id === cand.linkedPatientId; });
        if(patient){
          patient.registeredDate = iso;
          patientsChanged = true;
        }
      }
    });

    if(candidatesChanged){ await storageSet(K_CANDIDATES, S.candidates, true); }
    if(patientsChanged){ await storageSet(K_PATIENTS, S.patients, true); }
    await storageSet(flagKey, true, true);
  }

          categories:[cat], startMonths:startMonths,
          createdAt: todayStr()
        };

        S.patientStates[newP.id] = { items:{} };

  /* ================= 환자배정 관리 화면 ================= */
  function buildAssignmentRows(){
    var rows = [];
    var tf = S.tableFilters.assignment;
    S.patients
      .filter(function(p){
        if(!rowTextMatches(p.no, tf.no)) return false;
        if(!rowTextMatches(p.name, tf.name)) return false;
        if(tf.nurse){
          var nurseVal = tf.nurse === "__unassigned__" ? "" : tf.nurse;
          if((p.nurse||"") !== nurseVal) return false;
        }
        if(!rowTextMatches(p.location, tf.location)) return false;
        return true;
      })
      .forEach(function(p){
        var cats = (p.categories && p.categories.length) ? p.categories : [null];
        cats.forEach(function(cat){ rows.push({ patient:p, cat:cat }); });
      });
    if(tf.cat){
      rows = rows.filter(function(r){ return r.cat === tf.cat; });
    }
    if(tf.startMonth){
      rows = rows.filter(function(r){
        var sm = r.cat && r.patient.startMonths ? r.patient.startMonths[r.cat] : "";
        return sm === tf.startMonth;
      });
    }
    rows.sort(function(a,b){
      var na = a.patient.nurse || "", nb = b.patient.nurse || "";
      if(na !== nb) return na.localeCompare(nb, "ko");
      return (a.patient.name||"").localeCompare(b.patient.name||"", "ko");
    });
    return rows;
  }

  /* ================= 대상자 목록 화면 (전체 대상자 + 고정방문 리스트 병합) ================= */
  var CANDIDATE_TYPES = ["재택", "일방시", "장주사", "보류"];
  var CANDIDATE_FREQS = ["해당없음", "매주", "2주마다", "매달", "2달마다", "미정(확인필요)", "미방문"];
  var FIXED_FREQS = ["매주", "2주마다", "매달", "2달마다", "미정(확인필요)"]; // "고정방문 대상"으로 간주하는 주기

  /* ---- 탭별 열 필터 (엑셀 자동필터 방식) ---- */
  // columns: [{key, label, type:'text'|'select', options:[{value,label}]}]
  // tableId: S.tableFilters의 키 ("candidates"|"assignment"|"visits"|"bloodtest")
  function buildFilterHeaderRow(tableId, columns){
    var filters = S.tableFilters[tableId] || {};
    return '<tr class="filter-row">' + columns.map(function(col){
      if(col.type === "none"){
        return '<td></td>';
      }
      if(col.type === "select"){
        var opts = '<option value="">전체</option>' + col.options.map(function(o){
          return '<option value="'+escapeHtml(o.value)+'" '+(filters[col.key]===o.value?"selected":"")+'>'+escapeHtml(o.label)+'</option>';
        }).join("");
        return '<td><select class="tf-input" data-tf-table="'+tableId+'" data-tf-key="'+col.key+'">'+opts+'</select></td>';
      }
      if(col.type === "month"){
        return '<td><input type="month" class="tf-input" data-tf-table="'+tableId+'" data-tf-key="'+col.key+'" value="'+escapeHtml(filters[col.key]||"")+'"></td>';
      }
      return '<td><input type="text" class="tf-input" data-tf-table="'+tableId+'" data-tf-key="'+col.key+'" value="'+escapeHtml(filters[col.key]||"")+'" placeholder="검색"></td>';
    }).join("") + '</tr>';
  }

  function bindFilterHeaderRow(el, tableId, onChangeRender){
    el.querySelectorAll('.tf-input[data-tf-table="'+tableId+'"]').forEach(function(inp){
      inp.addEventListener("click", function(ev){ ev.stopPropagation(); });
      if(inp.tagName === "SELECT" || inp.type === "month"){
        // 선택형/달력형은 고르는 즉시(change) 바로 적용
        inp.addEventListener("change", function(e){
          var key = e.target.getAttribute("data-tf-key");
          S.tableFilters[tableId][key] = e.target.value.trim();
          onChangeRender();
        });
      } else {
        // 주관식(텍스트) 입력은 타이핑 중간에 매번 다시 그리면 한글 조합/숫자 입력이 끊기므로,
        // 다 입력하고 엔터를 눌렀을 때만 필터를 적용합니다.
        inp.addEventListener("keydown", function(e){
          if(e.key !== "Enter") return;
          e.preventDefault();
          var key = e.target.getAttribute("data-tf-key");
          S.tableFilters[tableId][key] = e.target.value.trim();
          onChangeRender();
        });
      }
    });
  }

  function rowTextMatches(cellValue, filterValue){
    if(!filterValue) return true;
    return String(cellValue||"").indexOf(filterValue) !== -1;
  }
  function rowSelectMatches(cellValue, filterValue){
    if(!filterValue) return true;
    return String(cellValue||"") === filterValue;
  }
  function rowMonthMatches(dateOrMonthStr, filterValue){
    if(!filterValue) return true;
    if(!dateOrMonthStr) return false;
    return dateOrMonthStr.slice(0,7) === filterValue;
  }

  function isFixedVisitCandidate(c){
    return FIXED_FREQS.indexOf(c.freq) !== -1;
  }

  // 대상자·환자 전체를 통틀어 가장 큰 번호 다음 값을 다음 번호로 제안합니다.
  function getNextCandidateNo(){
    var maxNo = 0;
    S.candidates.forEach(function(c){
      var n = parseInt(c.no, 10);
      if(!isNaN(n) && n > maxNo){ maxNo = n; }
    });
    S.patients.forEach(function(p){
      var n = parseInt(p.no, 10);
      if(!isNaN(n) && n > maxNo){ maxNo = n; }
    });
    return String(maxNo + 1);
  }

  function getVisibleCandidates(){
    var list = S.candidates.slice();
    if(S.candidateFilter === "fixed"){
      list = list.filter(isFixedVisitCandidate);
    }
    var tf = S.tableFilters.candidates;
    list = list.filter(function(c){
      if(!rowTextMatches(c.no, tf.no)) return false;
      if(!rowTextMatches(c.name, tf.name)) return false;
      if(tf.type){
        var types = (c.types && c.types.length) ? c.types : ["미지정"];
        if(types.indexOf(tf.type) === -1) return false;
      }
      if(!rowSelectMatches(c.freq || "해당없음", tf.freq)) return false;
      if(!rowMonthMatches(c.registeredDate, tf.registeredDate)) return false;
      if(tf.nurse){
        var nurseVal = tf.nurse === "__unassigned__" ? "" : tf.nurse;
        if((c.nurse||"") !== nurseVal) return false;
      }
      return true;
    });
    var sortKey = S.candidateSort;
    list.sort(function(a,b){
      if(sortKey === "no"){
        var na = parseInt(a.no,10), nb = parseInt(b.no,10);
        na = isNaN(na) ? Infinity : na; nb = isNaN(nb) ? Infinity : nb;
        if(na !== nb) return na - nb;
      } else if(sortKey === "type"){
        var ta = (a.types && a.types[0]) || "", tb = (b.types && b.types[0]) || "";
        if(ta !== tb) return ta.localeCompare(tb, "ko");
      } else if(sortKey === "freq"){
        var ai = CANDIDATE_FREQS.indexOf(a.freq), bi = CANDIDATE_FREQS.indexOf(b.freq);
        ai = ai === -1 ? 99 : ai; bi = bi === -1 ? 99 : bi;
        if(ai !== bi) return ai - bi;
      } else if(sortKey === "registeredDate"){
        var ra = a.registeredDate || "9999-99", rb = b.registeredDate || "9999-99";
        if(ra !== rb) return ra.localeCompare(rb);
      } else if(sortKey === "nurse"){
        var nua = a.nurse || "", nub = b.nurse || "";
        if(!nua && nub) return 1;
        if(nua && !nub) return -1;
        if(nua !== nub) return nua.localeCompare(nub, "ko");
      }
      return (a.name||"").localeCompare(b.name||"", "ko");
    });
    return list;
  }

  function renderCandidateView(){

      '<button class="btn btn-teal" id="addCandidateBtn">+ 새 대상자 추가</button></div>';

    html += '<div class="cand-toolbar">' +

        '<button class="cand-filter-btn'+(S.candidateFilter==="all"?" active":"")+'" data-filter="all">전체</button>' +
        '<button class="cand-filter-btn'+(S.candidateFilter==="fixed"?" active":"")+'" data-filter="fixed">고정방문 대상만</button>' +
      '</div>' +
      '<select class="cand-sort-select" id="candSortSelect">' +
        '<option value="no"'+(S.candidateSort==="no"?" selected":"")+'>번호순</option>' +

        '<option value="type"'+(S.candidateSort==="type"?" selected":"")+'>구분별</option>' +
        '<option value="freq"'+(S.candidateSort==="freq"?" selected":"")+'>고정방문 주기별</option>' +
        '<option value="registeredDate"'+(S.candidateSort==="registeredDate"?" selected":"")+'>등록날짜순</option>' +
        '<option value="nurse"'+(S.candidateSort==="nurse"?" selected":"")+'>담당간호사순</option>' +
      '</select>' +
    '</div>';

    html += '<div class="assign-table-wrap"><table class="assign-table"><thead><tr>' +
      '<th>번호</th><th>이름</th><th>구분</th><th>고정방문</th><th>등록날짜</th><th>담당간호사</th><th></th>' +
    '</tr>' +
    buildFilterHeaderRow("candidates", [
      { key:"no", type:"text" },
      { key:"name", type:"text" },
      { key:"type", type:"select", options: CANDIDATE_TYPES.concat(["미지정"]).map(function(t){ return {value:t,label:t}; }) },
      { key:"freq", type:"select", options: CANDIDATE_FREQS.map(function(f){ return {value:f,label:f}; }) },
      { key:"registeredDate", type:"month" },
      { key:"nurse", type:"select", options: [{value:"__unassigned__",label:"미배정"}].concat(S.staff.map(function(n){ return {value:n,label:n}; })) },
      { key:"_actions", type:"none" }
    ]) +
    '</thead><tbody>';

    if(list.length === 0){
      html += '<tr><td colspan="7" style="text-align:center;color:var(--ink-soft);padding:24px;">표시할 대상자가 없습니다.</td></tr>';
    } else {
      list.forEach(function(c){
        var typeBadge = (c.types && c.types.length)
          ? c.types.map(function(t){ return '<span class="badge badge-'+t+'">'+t+'</span>'; }).join(' ')
          : '<span class="badge badge-미지정">미지정</span>';
        var freqCls = isFixedVisitCandidate(c) ? "freq-tag active" : "freq-tag";
        var nurseCell = c.nurse
          ? escapeHtml(c.nurse)
          : '<span style="color:var(--ink-soft);">-</span>';
        html += '<tr>' +
          '<td>'+escapeHtml(c.no||"")+'</td>' +
          '<td style="font-weight:600;">'+escapeHtml(c.name)+'</td>' +
          '<td>'+typeBadge+'</td>' +
          '<td><span class="'+freqCls+'">'+escapeHtml(c.freq||"해당없음")+'</span></td>' +
          '<td>'+(c.registeredDate ? escapeHtml(c.registeredDate) : '<span style="color:var(--ink-soft);">-</span>')+'</td>' +
          '<td>'+nurseCell+'</td>' +
          '<td style="display:flex;gap:6px;">' +
            '<button class="btn btn-sm btn-teal" data-act="addvisit" data-cid="'+c.id+'">방문 등록</button>' +
            '<button class="btn btn-sm" data-act="editcand" data-cid="'+c.id+'">수정</button>' +
          '</td>' +
        '</tr>';
      });
    }
    html += '</tbody></table></div>';

    el.innerHTML = html;

    document.getElementById("addCandidateBtn").addEventListener("click", function(){ openCandidateModal(); });
    el.querySelectorAll('[data-filter]').forEach(function(btn){
      btn.addEventListener("click", function(){
        S.candidateFilter = btn.getAttribute("data-filter");
        renderCandidateView();
      });
    });
    document.getElementById("candSortSelect").addEventListener("change", function(e){
      S.candidateSort = e.target.value;
      renderCandidateView();
    });
    el.querySelectorAll('[data-act="editcand"]').forEach(function(btn){
      btn.addEventListener("click", function(){ openCandidateModal(btn.getAttribute("data-cid")); });
    });
    el.querySelectorAll('[data-act="addvisit"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var c = S.candidates.find(function(x){ return x.id === btn.getAttribute("data-cid"); });
        if(!c) return;
        openVisitModal({ no: c.no, name: c.name });
      });
    });
    bindFilterHeaderRow(el, "candidates", renderCandidateView);
  }

  function openCandidateModal(editId){
    var editing = editId ? S.candidates.find(function(x){ return x.id === editId; }) : null;
    var editingTypes = editing ? (editing.types || []) : [];

    var typeChecks = CANDIDATE_TYPES.map(function(t){
      var checked = editingTypes.indexOf(t) !== -1;
      return '<label><input type="checkbox" name="cTypeChk" value="'+t+'" '+(checked?'checked':'')+'> '+t+'</label>';
    }).join("");
    var freqOptions = CANDIDATE_FREQS.map(function(f){
      return '<option value="'+f+'" '+(editing && editing.freq===f ? "selected" : (!editing && f==="해당없음" ? "selected":""))+'>'+f+'</option>';
    }).join("");
    var nurseOptions = '<option value="">선택 안 함</option>' + S.staff.map(function(n){
      return '<option value="'+escapeHtml(n)+'" '+(editing && editing.nurse===n ? "selected" : "")+'>'+escapeHtml(n)+'</option>';
    }).join("") + '<option value="__add__">+ 새 이름 추가</option>';

    var showNurse = editing ? (FIXED_FREQS.indexOf(editing.freq) !== -1) : false;
    var defaultNo = editing ? (editing.no || "") : getNextCandidateNo();

    openModal(
      '<h3>'+(editing?'대상자 정보 수정':'새 대상자 추가')+'</h3>' +
      '<div class="field"><label>번호</label><input type="text" id="cNo" value="'+escapeHtml(defaultNo)+'" placeholder="예: 78"></div>' +
      '<div class="field"><label>이름</label><input type="text" id="cName" value="'+(editing?escapeHtml(editing.name):"")+'" placeholder="예: 최옥희"></div>' +
      '<div class="field"><label>구분 (복수 선택 가능)</label><div class="check-group">'+typeChecks+'</div></div>' +
      '<div class="field"><label>고정방문</label><select id="cFreq">'+freqOptions+'</select></div>' +
      '<div class="field"><label>등록날짜 (선택)</label><input type="date" id="cRegDate" value="'+(editing?escapeHtml(editing.registeredDate||""):"")+'">' +
        '<p style="font-size:11.5px;color:var(--ink-soft);margin-top:4px;">등록날짜를 정하면, 체크리스트 탭에서 그 달부터 이 환자가 표시됩니다.</p>' +
      '</div>' +
      '<div class="field" id="cNurseField" style="display:'+(showNurse?'':'none')+';">' +
        '<label>담당 간호사</label><select id="cNurse">'+nurseOptions+'</select>' +
        '<p style="font-size:11.5px;color:var(--ink-soft);margin-top:4px;">담당 간호사를 지정하면 "환자배정 관리" 탭에도 자동으로 등록됩니다.</p>' +
      '</div>' +
      '<div class="modal-actions">' +
        '<button class="btn" id="cCancel">취소</button>' +
        (editing ? '<button class="btn" style="color:var(--warn);border-color:var(--warn);" id="cDelete">삭제</button>' : '') +
        '<button class="btn btn-teal" id="cSave">'+(editing?'저장':'추가')+'</button>' +
      '</div>'
    );

    document.getElementById("cFreq").addEventListener("change", function(e){
      var isFixed = FIXED_FREQS.indexOf(e.target.value) !== -1;
      document.getElementById("cNurseField").style.display = isFixed ? "" : "none";
    });

    document.getElementById("cNurse").addEventListener("change", async function(e){
      if(e.target.value === "__add__"){
        var name = await showNestedPrompt("담당 간호사 이름을 입력해주세요.");
        var sel = document.getElementById("cNurse");
        if(name){
          name = name.trim();
          if(name && S.staff.indexOf(name) === -1){ S.staff.push(name); await storageSet(K_STAFF, S.staff, true); }
          var opt = document.createElement("option");
          opt.value = name; opt.textContent = name;
          sel.insertBefore(opt, sel.querySelector('option[value="__add__"]'));
          sel.value = name;
        } else {
          sel.value = editing && editing.nurse ? editing.nurse : "";
        }
      }
    });

    document.getElementById("cCancel").onclick = closeModal;
    if(editing){
      document.getElementById("cDelete").onclick = async function(){
        var ok = await showConfirm(editing.name + " 님을 대상자 목록에서 삭제할까요?");
        if(!ok) return;
        S.candidates = S.candidates.filter(function(x){ return x.id !== editing.id; });
        await storageSet(K_CANDIDATES, S.candidates, true);
        closeModal();
        showToast("삭제되었습니다.");
        renderAll();
      };
    }
    document.getElementById("cSave").onclick = async function(){
      var no = document.getElementById("cNo").value.trim();
      var name = document.getElementById("cName").value.trim();
      var types = Array.prototype.slice.call(document.querySelectorAll('input[name="cTypeChk"]:checked')).map(function(c){ return c.value; });
      var freq = document.getElementById("cFreq").value;
      var registeredDate = document.getElementById("cRegDate").value;
      var nurseField = document.getElementById("cNurse");
      var nurse = nurseField ? nurseField.value : "";
      if(nurse === "__add__") nurse = ""; // 새 이름 추가 중 저장 눌렀을 때 안전장치
      if(!name){ showToast("이름을 입력해주세요."); return; }

      var target;
      if(editing){
        editing.no = no; editing.name = name; editing.types = types; editing.freq = freq; editing.nurse = nurse; editing.registeredDate = registeredDate;
        target = editing;
      } else {
        target = { id: uid("c"), no:no, name:name, types:types, freq:freq, nurse:nurse, registeredDate:registeredDate, createdAt: todayStr() };
        S.candidates.push(target);
      }
      await storageSet(K_CANDIDATES, S.candidates, true);
      await syncCandidateToPatient(target);
      await syncRegisteredDateToPatient(target);
      closeModal();
      showToast(editing ? "수정되었습니다." : "추가되었습니다.");
      renderAll();
    };
  }

  // 대상자가 "고정방문 + 담당간호사 지정" 상태가 되면 환자배정(체크리스트)에도 자동 등록/갱신합니다.
  // 기존 환자 데이터를 지우는 방향으로는 절대 동작하지 않습니다(연결 해제해도 이미 만들어진 환자는 그대로 둠).
  async function syncCandidateToPatient(candidate){
    if(!candidate.nurse || FIXED_FREQS.indexOf(candidate.freq) === -1) return;

    var patient = null;
    if(candidate.linkedPatientId){
      patient = S.patients.find(function(p){ return p.id === candidate.linkedPatientId; });
    }
    if(!patient && candidate.no){
      patient = S.patients.find(function(p){ return (p.no||"") === candidate.no && p.name === candidate.name; });
    }

    var validCats = (candidate.types || []).filter(function(t){ return t !== "보류"; });

    if(patient){
      patient.nurse = candidate.nurse;
      validCats.forEach(function(cat){
        if(patient.categories.indexOf(cat) === -1){ patient.categories.push(cat); }
      });
      candidate.linkedPatientId = patient.id;
    } else {
      var newP = {
        id: (candidate.no || uid("p")), no: candidate.no || "", name: candidate.name, nurse: candidate.nurse,
        categories: validCats.slice(), startMonths: {}, registeredDate: candidate.registeredDate || "",
        createdAt: todayStr()
      };
      S.patients.push(newP);
      var virtualId = "virtual_" + candidate.no;
      if(candidate.no && S.patientStates[virtualId]){
        S.patientStates[newP.id] = S.patientStates[virtualId];
        delete S.patientStates[virtualId];
      } else if(!S.patientStates[newP.id]){
        S.patientStates[newP.id] = { items:{} };
      }
      await saveAllPatientStates();
      candidate.linkedPatientId = newP.id;
    }
    await storageSet(K_PATIENTS, S.patients, true);
    await storageSet(K_CANDIDATES, S.candidates, true);
  }

  // 등록날짜는 담당간호사 배정 여부와 무관하게, 이미 연동된 환자가 있으면 그쪽에도 반영합니다.
  // (체크리스트 탭에서 이 환자가 몇 월부터 보일지를 결정합니다.)
  async function syncRegisteredDateToPatient(candidate){
    if(!candidate.linkedPatientId) return;
    var patient = S.patients.find(function(p){ return p.id === candidate.linkedPatientId; });
    if(!patient) return;
    patient.registeredDate = candidate.registeredDate || "";
    await storageSet(K_PATIENTS, S.patients, true);
  }

  /* ================= 방문목록 화면 ================= */
  function pad2(n){ return String(n).padStart(2, "0"); }
  function makeVisitNo(no, dateStr){
    var parts = dateStr.split("-"); // YYYY-MM-DD
    return (no || "번호없음") + "(" + parts[1] + "-" + parts[2] + ")";
  }

  // 방문유형 고정 선택지 (탭 간 색상 일관성을 위해 정확히 일치하는 값만 사용)
  var VISIT_TYPES = ["재택포괄", "재택정기방문", "단독간호", "추가간호", "일방시", "일방시(의사단독)", "장주사의간동반", "장주사단독간호"];

  // 방문유형이 어느 구분(재택/일방시/장주사)에 해당하는지 매핑 (체크리스트에 언제 구분 블록을 보여줄지 판단용)
  var VISIT_TYPE_TO_CATEGORY = {
    "재택포괄": "재택", "재택정기방문": "재택", "단독간호": "재택", "추가간호": "재택",
    "일방시": "일방시", "일방시(의사단독)": "일방시",
    "장주사의간동반": "장주사", "장주사단독간호": "장주사"
  };
  // 이번달 방문목록에 그 구분(cat)에 해당하는 방문이 실제로 있었는지
  function patientCategoryVisitedThisMonth(p, cat, mkey){
    var list = S.visitsCache[mkey];
    if(!list || !p.no) return false;
    return list.some(function(v){
      return String(v.no) === String(p.no) && VISIT_TYPE_TO_CATEGORY[v.visitType] === cat;
    });
  }

  // 방문유형별로 어느 중분류(그룹)를 "처리"한 것으로 볼지 매핑 (대리방문 표시에 사용)
  var VISIT_TYPE_TO_GROUPS = {
    "재택포괄": ["동의서", "재택서식", "MINT 일방시"],
    "재택정기방문": ["동의서", "재택서식", "MINT 일방시"],
    "단독간호": ["단독간호"],
    "추가간호": ["추가간호"],
    "일방시": ["동의서", "방문", "MINT 일방시"],
    "일방시(의사단독)": ["동의서", "방문", "MINT 일방시"],
    "장주사의간동반": ["동의서", "장주서식"],
    "장주사단독간호": ["동의서", "장주서식"]
  };
  // 이번달, 이 환자의 이 구분/그룹을 처리한 방문 기록들 (담당간호사 대신 방문한 경우 표시하기 위함)
  function findVisitsForGroup(p, cat, groupName, mkey){
    var list = S.visitsCache[mkey];
    if(!list || !p.no) return [];
    return list.filter(function(v){
      if(String(v.no) !== String(p.no)) return false;
      if(VISIT_TYPE_TO_CATEGORY[v.visitType] !== cat) return false;
      var groups = VISIT_TYPE_TO_GROUPS[v.visitType] || [];
      return groups.indexOf(groupName) !== -1;
    });
  }
  // 그룹 제목 옆에 붙일 "OOO 대리방문 MM-DD" 안내 문구 (체크형 그룹용)
  function buildProxyNoteForGroup(p, cat, groupName, mkey){
    var visits = findVisitsForGroup(p, cat, groupName, mkey);
    var labels = [];
    visits.forEach(function(v){
      if(v.nurse && v.nurse !== p.nurse){
        var label = escapeHtml(v.nurse) + " 대리방문 " + fmtMD(v.date);
        if(labels.indexOf(label) === -1) labels.push(label);
      }
    });
    if(labels.length === 0) return "";
    return ' <span class="proxy-note">'+labels.join(", ")+'</span>';
  }
  // 특정 날짜 하나가 대리방문으로 기록된 것인지 (로그형 항목의 날짜 칩 옆 표시용)
  function findProxyNurseForDate(p, cat, groupName, dateStr, mkey){
    var visits = findVisitsForGroup(p, cat, groupName, mkey);
    var v = visits.find(function(x){ return x.date === dateStr; });
    if(v && v.nurse && v.nurse !== p.nurse) return v.nurse;
    return null;
  }
  var VISIT_TYPE_COLOR_MAP = {
    "재택포괄": { bg:"var(--home)", color:"#fff" },
    "재택정기방문": { bg:"var(--home)", color:"#fff" },
    "단독간호": { bg:"var(--solo)", color:"var(--solo-text)" },
    "추가간호": { bg:"var(--extra)", color:"var(--extra-text)" },
    "일방시": { bg:"var(--visit)", color:"var(--visit-text)" },
    "일방시(의사단독)": { bg:"var(--visit)", color:"var(--visit-text)" },
    "장주사의간동반": { bg:"var(--disability)", color:"var(--disability-text)" },
    "장주사단독간호": { bg:"var(--disability)", color:"var(--disability-text)" }
  };
  function renderVisitTypeBadge(text){
    if(!text) return "";
    var c = VISIT_TYPE_COLOR_MAP[text];
    if(c) return '<span class="badge" style="background:'+c.bg+';color:'+c.color+';">'+escapeHtml(text)+'</span>';
    return escapeHtml(text); // 예전에 자유입력으로 저장된 값 등 매칭 안되면 그냥 텍스트로
  }

  // 방문간호사별 고정 색상
  var VISIT_NURSE_COLOR_MAP = {
    "김혜경": { bg:"#E67C73", color:"#fff" },
    "전송이": { bg:"#C0CA33", color:"#4a4a10" },
    "안혜리": { bg:"#F6BF26", color:"#6b4f00" }
  };
  function renderVisitNurseBadge(name){
    if(!name) return "";
    var c = VISIT_NURSE_COLOR_MAP[name];
    if(!c) return escapeHtml(name);
    return '<span class="nurse-badge" style="background:'+c.bg+';color:'+c.color+';">'+escapeHtml(name)+'</span>';
  }

  async function switchVisitMonth(y, m){
    S.visitLogYear = y;
    S.visitLogMonth = m;
    S.visits = await loadVisitsForMonth(y, m);
    S.visitsCache[monthKey(y, m)] = S.visits;
    updateVisitsTabLabel();
    renderAll();
  }

  // 간호사별 방문유형별 방문횟수 + 전체 방문 통계 (관리자 전용)
  function buildNurseVisitStatsHtml(){
    var byNurse = {}; // nurse -> {type: count, ...}
    var nurseOrder = [];
    S.visits.forEach(function(v){
      var n = v.nurse || "미기재";
      if(!byNurse[n]){ byNurse[n] = {}; nurseOrder.push(n); }
      var t = v.visitType || "미지정";
      byNurse[n][t] = (byNurse[n][t] || 0) + 1;
    });
    nurseOrder.sort(function(a,b){ return a.localeCompare(b, "ko"); });

    var typeCols = VISIT_TYPES.slice();
    // 혹시 고정 목록에 없는 값(예전 자유입력 데이터 등)이 있으면 뒤에 추가
    Object.keys(byNurse).forEach(function(n){
      Object.keys(byNurse[n]).forEach(function(t){
        if(typeCols.indexOf(t) === -1) typeCols.push(t);
      });
    });

    var html = '<div class="assign-table-wrap" style="margin-bottom:14px;"><table class="assign-table"><thead><tr>' +
      '<th>간호사</th>' + typeCols.map(function(t){ return '<th>'+escapeHtml(t)+'</th>'; }).join("") + '<th>전체 방문</th>' +
    '</tr></thead><tbody>';

    if(nurseOrder.length === 0){
      html += '<tr><td colspan="'+(typeCols.length+2)+'" style="text-align:center;color:var(--ink-soft);padding:16px;">이 달에 방문 기록이 없습니다.</td></tr>';
    } else {
      nurseOrder.forEach(function(n){
        var total = 0;
        var cells = typeCols.map(function(t){
          var c = byNurse[n][t] || 0;
          total += c;
          return '<td style="text-align:center;">'+(c || '<span style="color:var(--ink-soft);">-</span>')+'</td>';
        }).join("");
        html += '<tr><td style="font-weight:600;">'+escapeHtml(n)+'</td>'+cells+'<td style="text-align:center;font-weight:700;">'+total+'</td></tr>';
      });
    }
    html += '</tbody></table></div>';
    return html;
  }

  // 일방시 계열 방문 입력통계 + MINT 일방시 체크 현황 (관리자 전용)
  var VISIT_TYPES_ONE_WAY = ["일방시", "일방시(의사단독)"];
  function buildMintStatsHtml(){
    var relevant = S.visits.filter(function(v){ return VISIT_TYPES_ONE_WAY.indexOf(v.visitType) !== -1; });
    var total = relevant.length;
    var checkedCount = relevant.filter(function(v){ return v.mintVisit; }).length;

    var byChecker = {};
    relevant.forEach(function(v){
      if(v.mintVisit){
        var c = v.mintCheckedBy || "미지정";
        byChecker[c] = (byChecker[c] || 0) + 1;
      }
    });
    var checkerNames = Object.keys(byChecker).sort(function(a,b){ return a.localeCompare(b,"ko"); });

    var html = '<div style="margin-bottom:14px;">';

    html += '<div class="assign-table-wrap">' +
      '<div style="padding:10px 12px;font-weight:700;font-size:13px;">MINT 일방시 체크 현황 <span style="font-weight:400;color:var(--ink-soft);font-size:12px;">(전체 '+total+'건 중 '+checkedCount+'건 체크됨)</span></div>' +
      '<table class="assign-table"><thead><tr><th>체크한 사람</th><th>체크 건수</th></tr></thead><tbody>';
    if(checkerNames.length === 0){
      html += '<tr><td colspan="2" style="text-align:center;color:var(--ink-soft);padding:16px;">이 달에 MINT 체크된 건이 없습니다.</td></tr>';
    } else {
      checkerNames.forEach(function(c){
        html += '<tr><td style="font-weight:600;">'+escapeHtml(c)+'</td><td style="text-align:center;">'+byChecker[c]+'</td></tr>';
      });
    }
    html += '</tbody></table></div>';

    html += '</div>';
    return html;
  }

  function renderVisitsView(){
    var el = document.getElementById("visitsView");
    if(!el) return;

    var tf = S.tableFilters.visits;
    var list = S.visits.slice()
      .filter(function(v){
        if(!rowTextMatches(v.name, tf.name)) return false;
        if(!rowSelectMatches(v.visitType, tf.visitType)) return false;
        if(tf.nurse){
          var nurseVal = tf.nurse === "__none__" ? "" : tf.nurse;
          if((v.nurse||"") !== nurseVal) return false;
        }
        if(tf.mintVisit){
          var mVal = tf.mintVisit === "yes";
          if(!!v.mintVisit !== mVal) return false;
        }
        return true;
      })
      .sort(function(a,b){
        if(a.date !== b.date) return a.date.localeCompare(b.date);
        return (a.createdAt||"").localeCompare(b.createdAt||"");
      });

    var html = '<div class="monthnav" style="justify-content:flex-start;gap:10px;padding-top:0;">' +
      '<button id="visitPrevMonth" aria-label="이전 달">‹</button>' +
      '<div class="label" style="min-width:auto;">'+S.visitLogYear+'년 '+S.visitLogMonth+'월 방문목록</div>' +
      '<button id="visitNextMonth" aria-label="다음 달">›</button>' +
    '</div>';

    html += '<div class="toolbar">' +
      '<h2>방문 기록 <span style="font-weight:400;color:var(--ink-soft);font-size:12.5px;">(총 '+list.length+'건)</span></h2>' +
      '<div style="display:flex;gap:8px;">' +
        (S.adminMode ? '<button class="btn btn-sm" id="toggleVisitStats">'+(S.visitStatsOpen?"방문통계 닫기":"간호사별 방문통계")+'</button>' : '') +
        (S.adminMode ? '<button class="btn btn-sm" id="toggleMintStats">'+(S.mintStatsOpen?"일방시 통계 닫기":"일방시 입력통계")+'</button>' : '') +
        '<button class="btn btn-teal" id="addVisitBtn">+ 새 방문 등록</button>' +
      '</div>' +
    '</div>';

    if(S.adminMode && S.visitStatsOpen){
      html += buildNurseVisitStatsHtml();
    }
    if(S.adminMode && S.mintStatsOpen){
      html += buildMintStatsHtml();
    }

    html += '<div class="assign-table-wrap"><table class="assign-table visit-table"><thead><tr>' +
      '<th>연번</th><th>방문일자</th><th>방문번호</th><th>이름</th><th>방문유형</th><th>방문간호사</th>' +
      '<th>간호메모</th><th>LAB</th><th>비고</th><th>MINT<br>일방시</th>' +
    '</tr>' +
    buildFilterHeaderRow("visits", [
      { key:"seq", type:"none" },
      { key:"date", type:"none" },
      { key:"visitNo", type:"none" },
      { key:"name", type:"text" },
      { key:"visitType", type:"select", options: VISIT_TYPES.map(function(t){ return {value:t,label:t}; }) },
      { key:"nurse", type:"select", options: [{value:"__none__",label:"미기재"}].concat(S.staff.map(function(n){ return {value:n,label:n}; })) },
      { key:"memo", type:"none" },
      { key:"bloodTest", type:"none" },
      { key:"note", type:"none" },
      { key:"mintVisit", type:"select", options:[{value:"yes",label:"O"},{value:"no",label:"-"}] }
    ]) +
    '</thead><tbody>';

    if(list.length === 0){
      html += '<tr><td colspan="10" style="text-align:center;color:var(--ink-soft);padding:24px;">이 달에 등록된 방문 기록이 없습니다.</td></tr>';
    } else {
      list.forEach(function(v, idx){
        html += '<tr>' +
          '<td style="color:var(--ink-soft);font-variant-numeric:tabular-nums;">'+(idx+1)+'</td>' +
          '<td style="font-variant-numeric:tabular-nums;white-space:nowrap;">'+escapeHtml(fmtMDWeekday(v.date))+'</td>' +
          '<td style="font-variant-numeric:tabular-nums;">'+escapeHtml(v.visitNo)+'</td>' +
          '<td style="font-weight:600;cursor:pointer;" data-act="editvisit" data-vid="'+v.id+'" title="더블클릭하면 수정할 수 있습니다">'+escapeHtml(v.name)+'</td>' +
          '<td>'+renderVisitTypeBadge(v.visitType||"")+'</td>' +
          '<td>'+renderVisitNurseBadge(v.nurse||"")+'</td>' +
          '<td class="memo-cell"><textarea class="inline-edit" rows="1" data-act="editmemo" data-vid="'+v.id+'">'+escapeHtml(v.memo||"")+'</textarea></td>' +
          '<td>'+(v.bloodTest ? '<input type="checkbox" class="chk" data-act="toggleblood" data-vid="'+v.id+'" checked>' : '<input type="checkbox" class="chk" data-act="toggleblood" data-vid="'+v.id+'">')+'</td>' +
          '<td class="memo-cell"><textarea class="inline-edit" rows="1" data-act="editnote" data-vid="'+v.id+'">'+escapeHtml(v.note||"")+'</textarea></td>' +
          '<td>'+(v.mintVisit ? '<input type="checkbox" class="chk" data-act="togglemint" data-vid="'+v.id+'" checked>' : '<input type="checkbox" class="chk" data-act="togglemint" data-vid="'+v.id+'">')+
            (S.adminMode && v.mintVisit ? ' <span class="mint-by" data-act="editmintby" data-vid="'+v.id+'" title="클릭하면 체크한 사람을 바꿀 수 있습니다">'+escapeHtml(v.mintCheckedBy||"미지정")+'</span>' : '') +
          '</td>' +
        '</tr>';
      });
    }
    html += '</tbody></table></div>';

    el.innerHTML = html;

    document.getElementById("visitPrevMonth").addEventListener("click", function(){
      var y = S.visitLogYear, m = S.visitLogMonth - 1;
      if(m < 1){ m = 12; y -= 1; }
      switchVisitMonth(y, m);
    });
    document.getElementById("visitNextMonth").addEventListener("click", function(){
      var y = S.visitLogYear, m = S.visitLogMonth + 1;
      if(m > 12){ m = 1; y += 1; }
      switchVisitMonth(y, m);
    });
    document.getElementById("addVisitBtn").addEventListener("click", function(){ openVisitModal(); });
    var statsBtn = document.getElementById("toggleVisitStats");
    if(statsBtn){
      statsBtn.addEventListener("click", function(){
        S.visitStatsOpen = !S.visitStatsOpen;
        renderVisitsView();
      });
    }
    var mintStatsBtn = document.getElementById("toggleMintStats");
    if(mintStatsBtn){
      mintStatsBtn.addEventListener("click", function(){
        S.mintStatsOpen = !S.mintStatsOpen;
        renderVisitsView();
      });
    }
    el.querySelectorAll('[data-act="editvisit"]').forEach(function(cell){
      cell.addEventListener("dblclick", function(){ openVisitModal(null, cell.getAttribute("data-vid")); });
    });
    el.querySelectorAll('[data-act="togglemint"]').forEach(function(chk){
      chk.addEventListener("click", async function(ev){ ev.stopPropagation(); });
      chk.addEventListener("change", async function(e){
        var vid = e.target.getAttribute("data-vid");
        var v = S.visits.find(function(x){ return x.id === vid; });
        if(!v) return;
        v.mintVisit = e.target.checked;
        if(v.mintVisit){
          v.mintCheckedBy = (SESSION && SESSION.name) ? SESSION.name : (S.who || "미지정");
        } else {
          delete v.mintCheckedBy;
        }
        await saveVisitsForMonth(S.visitLogYear, S.visitLogMonth, S.visits);
        showToast(v.mintVisit ? "MINT 일방시 체크되었습니다." : "MINT 일방시 체크 해제되었습니다.");
        renderVisitsView();
      });
    });
    el.querySelectorAll('[data-act="editmintby"]').forEach(function(span){
      span.addEventListener("click", async function(ev){
        ev.stopPropagation();
        var vid = span.getAttribute("data-vid");
        var v = S.visits.find(function(x){ return x.id === vid; });
        if(!v) return;
        var allCheckers = S.staff.concat((S.mintCheckers||[]).filter(function(n){ return S.staff.indexOf(n) === -1; }));
        var options = allCheckers.map(function(n){ return {value:n, label:n}; });
        var chosen = await showSelectPrompt("MINT 일방시를 체크한 사람", options, v.mintCheckedBy || "");
        if(chosen === null) return;
        v.mintCheckedBy = chosen;
        await saveVisitsForMonth(S.visitLogYear, S.visitLogMonth, S.visits);
        showToast("체크한 사람이 수정되었습니다.");
        renderVisitsView();
      });
    });
    el.querySelectorAll('[data-act="toggleblood"]').forEach(function(chk){
      chk.addEventListener("click", async function(ev){ ev.stopPropagation(); });
      chk.addEventListener("change", async function(e){
        var vid = e.target.getAttribute("data-vid");
        var v = S.visits.find(function(x){ return x.id === vid; });
        if(!v) return;
        v.bloodTest = e.target.checked;
        await saveVisitsForMonth(S.visitLogYear, S.visitLogMonth, S.visits);
        if(v.bloodTest){
          await ensureBloodTestForVisit(v);
          showToast("혈액검사 체크되어 혈액검사 탭에 등록되었습니다.");
        } else {
          showToast("혈액검사 체크 해제되었습니다.");
        }
      });
    });
    el.querySelectorAll('[data-act="editmemo"], [data-act="editnote"]').forEach(function(inp){
      inp.style.height = inp.scrollHeight + "px";
      inp.addEventListener("click", function(ev){ ev.stopPropagation(); });
      inp.addEventListener("input", function(e){
        e.target.style.height = "auto";
        e.target.style.height = e.target.scrollHeight + "px";
      });
      inp.addEventListener("change", async function(e){
        var vid = e.target.getAttribute("data-vid");
        var field = e.target.getAttribute("data-act") === "editmemo" ? "memo" : "note";
        var v = S.visits.find(function(x){ return x.id === vid; });
        if(!v) return;
        v[field] = e.target.value.trim();
        await saveVisitsForMonth(S.visitLogYear, S.visitLogMonth, S.visits);
      });
    });
    bindFilterHeaderRow(el, "visits", renderVisitsView);
  }

  // presetCandidate: 대상자 목록에서 "방문 등록" 눌렀을 때 바로 넘어오는 {no, name}
  // editVisitId: 기존 방문 수정시 방문 id (이 경우 그 방문이 속한 연/월을 찾아서 편집)
